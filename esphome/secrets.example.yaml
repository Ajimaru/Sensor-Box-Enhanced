# Copy to secrets.yaml and fill in. secrets.yaml is git-ignored.

wifi_ssid: "<WiFi SSID>"
wifi_password: "<WiFi password, also used for the fallback AP>"

web_server_username: "<web UI user>"
web_server_password: "<web UI password>"

# 32-byte base64 key, see https://esphome.io/components/api.html#configuration-variables
api_encryption_key: "<base64 key>"
