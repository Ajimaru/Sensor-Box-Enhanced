# Display
   #show_test_card: true
display:
  - platform: mipi_spi
    model: ILI9341
    id: display_main
    cs_pin: GPIO03
    dc_pin: GPIO04
    reset_pin: GPIO06
    spi_id: display_spi_bus
    # mipi_spi defaults to 10 MHz; ili9xxx ran at 40 MHz.
    data_rate: 40MHz
    # Explicit transform replaces the model default (mirror_x: true); same MADCTL as ili9xxx before (BGR | MY).
    transform:
      mirror_x: false
      mirror_y: true
      swap_xy: false
    color_order: bgr
    invert_colors: false
    update_interval: 4s
    lambda: |-
      // The page is drawn by draw_screen, which the lambda calls once for the display and, after a print
      // request, a second time into the 1-bit printer canvas (thermal_print.h).
      auto draw_screen = [&](display::Display &it) {
      auto w = it.get_width();
      auto h = it.get_height();
      auto fv30 = id(font_value_30);
      auto fh36 = id(font_heading_36);
      auto fl14 = id(font_label_14);
      auto fl18 = id(font_label_18);
      auto col = id(white);
      int current_main_display_mode = id(main_display_mode);
      auto co2 = id(co2_scd40).state;
      auto ch2o = id(ch2o_ze08).state;
      auto e_voc = id(tvoc_ens160).state;
      auto eco2_ens = id(eco2_ens160).state;
      auto eco2_sgp = id(eco2_sgp30).state;
      auto sgp30 = id(tvoc_sgp30).state;
      // The SGP30 answers 400 ppm / 0 ppb until it has applied its stored baseline a few seconds after a
      // reboot; hide its columns for the first two minutes so a restart does not show those placeholders.
      bool sgp30_usable = id(sgp30_baseline_saved) && id(uptime_sensor).state > 120;
      auto pm1 = id(pm1_pms).state;
      auto pm25 = id(pm25_pms).state;
      auto pm10 = id(pm10_pms).state;
      auto aqi_voc = id(aqi_voc_sgp41).state;
      auto aqi_nox = id(aqi_nox_sgp41).state;
      auto ens160_aqi = id(aqi_ens160).state;
      float pressure = id(pres_bme680).state;
      float dew_point = id(dew_point_bme680).state;
      float abs_humidity = id(calculated_absolute_humidity).state;
      float altitude = id(calculated_altitude).state;
      auto light = id(ambient_light_ltr390).state;
      // Colour steps are anchored to published guideline values (see docs/sensor-capability-matrix.md):
      // CO2 1000 ppm = UBA and ASR A3.6 "ventilate", 2000 ppm = ASR "not acceptable", 3000 ppm far above;
      // PM2.5 / PM10 = WHO 2021 24 h guidelines and their interim targets, PM10 50 = EU daily limit;
      // CH2O 80 ppb = 0.1 mg/m3 (WHO indoor air guidelines / UBA indoor value), 120 / 200 / 400 = 1.5x / 2.5x / 5x.
      col = id(white); if (co2 > 1000){col = id(yellow);} if (co2 > 1500){col = id(orange);} if (co2 > 2000){col = id(red);} if (co2 > 3000){col = id(purple);} auto co2_c = col;
      col = id(white); if (ch2o > 80){col = id(yellow);} if (ch2o > 120){col = id(orange);} if (ch2o > 200){col = id(red);} if (ch2o > 400){col = id(purple);} auto ch2o_c = col;
      // TVOC is a sum parameter without a health-based limit; these are the room's own trend bands.
      col = id(white); if (e_voc > 400){col = id(yellow);} if (e_voc > 800){col = id(orange);} if (e_voc > 1400){col = id(red);} if (e_voc > 2000){col = id(purple);} auto e_voc_c = col;
      col = id(white); if (sgp30 > 400){col = id(yellow);} if (sgp30 > 800){col = id(orange);} if (sgp30 > 1400){col = id(red);} if (sgp30 > 2000){col = id(purple);} auto sgp30_c = col;
      // No guideline exists for PM1, so it stays neutral instead of colouring at 5 µg/m³.
      auto pm1_c = id(white);
      col = id(white); if (pm25 > 15){col = id(yellow);} if (pm25 > 25){col = id(orange);} if (pm25 > 50){col = id(red);} if (pm25 > 75){col = id(purple);} auto pm25_c = col;
      col = id(white); if (pm10 > 45){col = id(yellow);} if (pm10 > 50){col = id(orange);} if (pm10 > 75){col = id(red);} if (pm10 > 100){col = id(purple);} auto pm10_c = col;
      col = id(white);
      if (!isnan(light)) {
        if (light < 50){col = id(grey);}
        if (light > 200){col = id(yellow);}
        if (light > 800){col = id(orange);}
        if (light > 2000){col = id(red);}
      }
      auto light_c = col;
      float temps[4] = {id(temp_bme680).state, id(temp_sht41).state, id(temp_scd40).state, id(temp_aht21_ens).state};
      float hums[4] = {id(hum_bme680).state, id(hum_sht41).state, id(hum_scd40).state, id(hum_aht21_ens).state};
      float temp = NAN;
      float hum = NAN;
      for (float t : temps) { if (!isnan(t)) { temp = t; break; } }
      for (float h : hums) { if (!isnan(h)) { hum = h; break; } }
      col = id(white); if (hum < 20){col = id(yellow);} if (hum > 75){col = id(red);} auto hum_c = col;
      int temp_hum_display_offset_y = 0;
      int top_section_height = 33;
      int padding_after_top = 4;
      int font_height_bottom = fl14->get_height();
      int bottom_margin_val = 1;
      int bottom_bar_height = font_height_bottom + bottom_margin_val;
      int footer_start_y = h - bottom_bar_height;
      it.filled_rectangle(0, 0, w, footer_start_y, Color::BLACK);
      // The top row only exists on the values page: keep the rotation paused while another page shows, so
      // returning always starts with a full 10 s instead of a random sub-view.
      uint32_t global_current_time_ms = (uint32_t) (esp_timer_get_time() / 1000);
      if (current_main_display_mode == 0) {
        if (global_current_time_ms - id(last_top_toggle_time) >= 10000) {
          id(top_display_mode_toggle) = (id(top_display_mode_toggle) + 1) % 5;
          id(last_top_toggle_time) = global_current_time_ms;
        }
      } else {
        id(last_top_toggle_time) = global_current_time_ms;
      }
      int current_top_display_mode = id(top_display_mode_toggle);
      int left_col_x = 70;
      int right_col_x = 190;
      int graph_y_start = 10;
      int graph_padding = 5;
      int num_graphs_on_most_pages = 5;
      int graph_height = (footer_start_y - graph_y_start - (num_graphs_on_most_pages-1) * graph_padding) / num_graphs_on_most_pages;
      if (current_main_display_mode == 0) {
        it.filled_rectangle(0, 0, w, top_section_height + padding_after_top, Color::BLACK);
        if (current_top_display_mode == 0) {
          int temp_left_x = 100;
          it.printf(temp_left_x, 30 + temp_hum_display_offset_y, fl14, id(grey), TextAlign::BOTTOM_LEFT, "°C");
          if (!isnan(temp)) {
              it.printf(temp_left_x, 34 + temp_hum_display_offset_y, fv30, white, display::TextAlign::BOTTOM_RIGHT, "%.1f", temp);
          } else {
              it.print(temp_left_x, 34 + temp_hum_display_offset_y, fv30, id(grey), display::TextAlign::BOTTOM_RIGHT, "--");
          }
          it.printf(right_col_x, 18 + temp_hum_display_offset_y, fl14, id(grey), TextAlign::BOTTOM_LEFT, "RH");
          it.print(right_col_x, 30 + temp_hum_display_offset_y, fl14, id(grey), TextAlign::BOTTOM_LEFT, "\%");
          if (!isnan(hum)) {
              it.printf(right_col_x, 34 + temp_hum_display_offset_y, fv30, white, display::TextAlign::BOTTOM_RIGHT, "%.1f", hum);
          } else {
              it.print(right_col_x, 34 + temp_hum_display_offset_y, fv30, id(grey), display::TextAlign::BOTTOM_RIGHT, "--");
          }
        } else if (current_top_display_mode == 1) {
          it.printf(left_col_x, 30 + temp_hum_display_offset_y, fl14, id(grey), TextAlign::BOTTOM_LEFT, "Td °C");
          if (!isnan(dew_point)) {
              it.printf(left_col_x, 34 + temp_hum_display_offset_y, fv30, white, display::TextAlign::BOTTOM_RIGHT, "%.1f", dew_point);
          } else {
              it.print(left_col_x, 34 + temp_hum_display_offset_y, fv30, id(grey), display::TextAlign::BOTTOM_RIGHT, "--");
          }

          it.printf(right_col_x, 18 + temp_hum_display_offset_y, fl14, id(grey), TextAlign::BOTTOM_LEFT, "g/m³");
          if (!isnan(abs_humidity)) {
              it.printf(right_col_x, 34 + temp_hum_display_offset_y, fv30, white, display::TextAlign::BOTTOM_RIGHT, "%.1f", abs_humidity);
          } else {
              it.print(right_col_x, 34 + temp_hum_display_offset_y, fv30, id(grey), display::TextAlign::BOTTOM_RIGHT, "--");
          }
        } else if (current_top_display_mode == 2) {
          it.printf(left_col_x, 30 + temp_hum_display_offset_y, fl14, id(grey), TextAlign::BOTTOM_LEFT, "hPa");
          if (!isnan(pressure)) {
              it.printf(left_col_x, 34 + temp_hum_display_offset_y, fv30, white, display::TextAlign::BOTTOM_RIGHT, "%.0f", pressure);
          } else {
              it.print(left_col_x, 34 + temp_hum_display_offset_y, fv30, id(grey), display::TextAlign::BOTTOM_RIGHT, "--");
          }
          it.printf(right_col_x, 18 + temp_hum_display_offset_y, fl14, id(grey), TextAlign::BOTTOM_LEFT, "m");
          if (!isnan(altitude)) {
              it.printf(right_col_x, 34 + temp_hum_display_offset_y, fv30, white, display::TextAlign::BOTTOM_RIGHT, "%.0f", altitude);
          } else {
              it.print(right_col_x, 34 + temp_hum_display_offset_y, fv30, id(grey), display::TextAlign::BOTTOM_RIGHT, "--");
          }
        } else if (current_top_display_mode == 3) {
          if (!isnan(light)) {
            it.printf(left_col_x, 34 + temp_hum_display_offset_y, fv30, white, display::TextAlign::BOTTOM_RIGHT, "%.0f", light);
            it.print(left_col_x, 30 + temp_hum_display_offset_y, fl14, id(grey), TextAlign::BOTTOM_LEFT, "lx");
          } else {
             it.print(left_col_x, 18 + temp_hum_display_offset_y, fl14, id(grey), TextAlign::BOTTOM_LEFT, "Light");
             it.print(left_col_x, 34 + temp_hum_display_offset_y, fv30, id(grey), display::TextAlign::BOTTOM_RIGHT, "--");
          }
          // UV index, colored by the WHO scale.
          float uvi = id(uv_index_ltr390).state;
          it.print(right_col_x, 18 + temp_hum_display_offset_y, fl14, id(grey), TextAlign::BOTTOM_LEFT, "UVI");
          if (!isnan(uvi)) {
              esphome::Color uvi_c = id(white);
              if (uvi >= 11) { uvi_c = id(purple); }
              else if (uvi >= 8) { uvi_c = id(red); }
              else if (uvi >= 6) { uvi_c = id(orange); }
              else if (uvi >= 3) { uvi_c = id(yellow); }
              it.printf(right_col_x, 34 + temp_hum_display_offset_y, fv30, uvi_c, display::TextAlign::BOTTOM_RIGHT, "%.1f", uvi);
          } else {
              it.print(right_col_x, 34 + temp_hum_display_offset_y, fv30, id(grey), display::TextAlign::BOTTOM_RIGHT, "--");
          }
        } else if (current_top_display_mode == 4) {
          if (!isnan(ens160_aqi)) {
              esphome::Color aqi_c = id(white);
              if (ens160_aqi >= 5) { aqi_c = id(purple); }
              else if (ens160_aqi >= 4) { aqi_c = id(red); }
              else if (ens160_aqi >= 3) { aqi_c = id(orange); }
              else if (ens160_aqi >= 2) { aqi_c = id(yellow); }
              it.print(left_col_x, 18 + temp_hum_display_offset_y, fl14, id(grey), TextAlign::BOTTOM_LEFT, "AQI");
              it.printf(left_col_x, 34 + temp_hum_display_offset_y, fv30, aqi_c, display::TextAlign::BOTTOM_RIGHT, "%.0f", ens160_aqi);
          } else {
              it.print(left_col_x, 18 + temp_hum_display_offset_y, fl14, id(grey), TextAlign::BOTTOM_LEFT, "AQI");
              it.print(left_col_x, 34 + temp_hum_display_offset_y, fv30, id(grey), display::TextAlign::BOTTOM_RIGHT, "--");
          }
          // BME680 BSEC2 IAQ (0-500); grey until BSEC2 reports "Calibrating" or "Calibrated".
          float iaq = id(iaq_bme680).state;
          const std::string &iaq_acc = id(iaq_accuracy_bme680).state;
          bool iaq_calibrated = (iaq_acc == "Calibrating" || iaq_acc == "Calibrated");
          it.print(right_col_x, 18 + temp_hum_display_offset_y, fl14, id(grey), TextAlign::BOTTOM_LEFT, "IAQ");
          if (!isnan(iaq)) {
              esphome::Color iaq_c = id(grey);
              if (iaq_calibrated) {
                iaq_c = id(white);
                if (iaq > 300) { iaq_c = id(purple); }
                else if (iaq > 200) { iaq_c = id(red); }
                else if (iaq > 100) { iaq_c = id(orange); }
                else if (iaq > 50) { iaq_c = id(yellow); }
              }
              it.printf(right_col_x, 34 + temp_hum_display_offset_y, fv30, iaq_c, display::TextAlign::BOTTOM_RIGHT, "%.0f", iaq);
          } else {
              it.print(right_col_x, 34 + temp_hum_display_offset_y, fv30, id(grey), display::TextAlign::BOTTOM_RIGHT, "--");
          }
        }
        auto cy_main = top_section_height + padding_after_top;
        auto title = "";
        auto unit = "";
        // Particles: always drawn, so a missing PMS reading shows as "--" instead of the block silently
        // disappearing. The PMS keeps its own state across an ESP reboot and can stay asleep, which left
        // all three values NA and the page without a particles block.
        {
          title = "Particles"; unit = "µg/m³";
          it.line(0,cy_main,w,cy_main,id(white));
          it.print(2, cy_main + 22, fh36, id(light_grey), TextAlign::CENTER_LEFT, title);
          it.print(w-2, cy_main + 31, fl14, id(grey), TextAlign::CENTER_RIGHT, unit);
          const char *pm_names[3] = {"PM1", "PM2.5", "PM10"};
          float pm_values[3] = {pm1, pm25, pm10};
          esphome::Color pm_colors[3] = {pm1_c, pm25_c, pm10_c};
          for (int i = 0; i < 3; i++) {
            // One third per column, left aligned so every row starts at the same edge.
            int x = 2 + i * w / 3;
            it.printf(x, cy_main + 58, fl14, id(grey), TextAlign::BOTTOM_LEFT, "%s", pm_names[i]);
            if (!isnan(pm_values[i])) {
              it.printf(x, cy_main + 50, fv30, pm_colors[i], display::TextAlign::TOP_LEFT, "%.0f", pm_values[i]);
            } else {
              it.print(x, cy_main + 50, fv30, id(grey), display::TextAlign::TOP_LEFT, "--");
            }
          }
          cy_main += 88;
        }
        // CO2: the SCD40 measures it directly, the ENS160 and SGP30 estimate it from VOCs and sit to the right
        // under their own "(E)CO2" heading. A column only appears once its sensor has a value; the SGP30 waits
        // for its learned baseline (sgp30_baseline_saved).
        {
          const char *co2_names[3];
          float co2_values[3];
          esphome::Color co2_colors[3];
          int co2_count = 0;
          bool has_sgp30_eco2 = sgp30_usable && !isnan(eco2_sgp);
          if (!isnan(co2)) { co2_names[co2_count] = "SCD40"; co2_values[co2_count] = co2; co2_colors[co2_count] = co2_c; co2_count++; }
          if (!isnan(eco2_ens)) { co2_names[co2_count] = "ENS160"; co2_values[co2_count] = eco2_ens; co2_colors[co2_count] = id(white); co2_count++; }
          if (has_sgp30_eco2) { co2_names[co2_count] = "SGP30"; co2_values[co2_count] = eco2_sgp; co2_colors[co2_count] = id(white); co2_count++; }
          if (co2_count > 0) {
            title = "CO2"; unit = "ppm";
            it.line(0,cy_main,w,cy_main,id(white));
            it.print(2, cy_main + 22, fh36, id(light_grey), TextAlign::CENTER_LEFT, title);
            // 14 px on purpose: the 36 px heading font has no parentheses. The label belongs over the first
            // estimate column, but "CO2" in Orbitron 36 is ~89 px wide and starts at x = 2, so with three
            // columns the column edge (x = 82) sits inside the title. Push the label past the title then;
            // with two columns (x = 122) it stays aligned with the ENS160 column.
            if (co2_count > 1) {
              const int title_right = 2 + 89;
              int est_x = 2 + w / co2_count;
              if (est_x < title_right + 4)
                est_x = title_right + 4;
              it.print(est_x, cy_main + 26, fl14, id(grey), TextAlign::CENTER_LEFT, "(E)CO2");
            }
            it.print(w-2, cy_main + 31, fl14, id(grey), TextAlign::CENTER_RIGHT, unit);
            for (int i = 0; i < co2_count; i++) {
              // Left aligned: sensors start at the left edge and fill to the right as they deliver values.
              int x = 2 + i * w / co2_count;
              it.printf(x, cy_main + 58, fl14, id(grey), TextAlign::BOTTOM_LEFT, "%s", co2_names[i]);
              it.printf(x, cy_main + 50, fv30, co2_colors[i], display::TextAlign::TOP_LEFT, "%.0f", co2_values[i]);
            }
            cy_main += 88;
          }
        }
        // Gas: ZE08 CH2O (formaldehyde) and ENS160 TVOC in ppb, plus ONE of SGP30 (TVOC, ppb) or SGP41 (VOC
        // index) — the board has room for only one of the two, so both are configured and the fitted one wins.
        // Fixed order as listed; a column appears only once its sensor is usable (the SGP30 waits for its
        // learned baseline, see sgp30_baseline_saved). The SGP41 NOx index sits small above the unit and only
        // appears with a value (no room for a line below: header + 3 blocks use 301 of the 305 px above the footer).
        bool has_sgp41 = !isnan(aqi_voc);
        bool has_sgp30 = !has_sgp41 && sgp30_usable && !isnan(sgp30);
        if (!isnan(ch2o) || !isnan(e_voc) || has_sgp30 || has_sgp41 || !isnan(aqi_nox)) {
          title = "Gas";
          unit = has_sgp41 ? "ppb/idx" : "ppb";
          it.line(0,cy_main,w,cy_main,id(white));
          it.print(2, cy_main + 22, fh36, id(light_grey), TextAlign::CENTER_LEFT, title);
          it.print(w-2, cy_main + 31, fl14, id(grey), TextAlign::CENTER_RIGHT, unit);
          esphome::Color aqi_voc_c = id(white);
          if (aqi_voc > 50) { aqi_voc_c = id(yellow); }
          if (aqi_voc > 150) { aqi_voc_c = id(orange); }
          if (aqi_voc > 250) { aqi_voc_c = id(red); }
          if (aqi_voc > 350) { aqi_voc_c = id(purple); }
          const char *gas_names[3];
          float gas_values[3];
          esphome::Color gas_colors[3];
          int gas_count = 0;
          if (!isnan(ch2o)) { gas_names[gas_count] = "ZE08-CH2O"; gas_values[gas_count] = ch2o; gas_colors[gas_count] = ch2o_c; gas_count++; }
          if (!isnan(e_voc)) { gas_names[gas_count] = "ENS160"; gas_values[gas_count] = e_voc; gas_colors[gas_count] = e_voc_c; gas_count++; }
          if (has_sgp41) { gas_names[gas_count] = "SGP41 idx"; gas_values[gas_count] = aqi_voc; gas_colors[gas_count] = aqi_voc_c; gas_count++; }
          else if (has_sgp30) { gas_names[gas_count] = "SGP30"; gas_values[gas_count] = sgp30; gas_colors[gas_count] = sgp30_c; gas_count++; }
          for (int i = 0; i < gas_count; i++) {
            // Left aligned like the other blocks: values appear from the left as sensors come online.
            int x = 2 + i * w / gas_count;
            it.printf(x, cy_main + 58, fl14, id(grey), TextAlign::BOTTOM_LEFT, "%s", gas_names[i]);
            it.printf(x, cy_main + 50, fv30, gas_colors[i], display::TextAlign::TOP_LEFT, "%.0f", gas_values[i]);
          }
          if(!isnan(aqi_nox)){
            esphome::Color aqi_nox_c = id(white);
            if (aqi_nox > 50) { aqi_nox_c = id(yellow); }
            if (aqi_nox > 150) { aqi_nox_c = id(orange); }
            if (aqi_nox > 250) { aqi_nox_c = id(red); }
            if (aqi_nox > 350) { aqi_nox_c = id(purple); }
            it.printf(w-2, cy_main + 14, fl14, aqi_nox_c, TextAlign::CENTER_RIGHT, "%.0f", aqi_nox);
            it.print(w-30, cy_main + 14, fl14, id(grey), TextAlign::CENTER_RIGHT, "NOx");
          }
          cy_main += 88;
        }
      } else if (current_main_display_mode == 1) {
         int graph_y_current = graph_y_start;
         int label_col_x = 80;
         int graph_col_x = 85;
         it.printf(label_col_x, graph_y_current, fl14, id(grey), TextAlign::TOP_RIGHT, "ppb");
         it.printf(label_col_x, graph_y_current + graph_height / 2, fl14, id(white), TextAlign::CENTER_RIGHT, "TVOC");
         it.graph(graph_col_x, graph_y_current, id(voc_graph));
         graph_y_current += graph_height + graph_padding;
         it.printf(label_col_x, graph_y_current, fl14, id(grey), TextAlign::TOP_RIGHT, "ppm  %d", 3400);
         it.printf(label_col_x, graph_y_current + graph_height / 2, fl14, id(white), TextAlign::CENTER_RIGHT, "CO2");
         it.printf(label_col_x, graph_y_current + graph_height - 1, fl14, id(grey), TextAlign::BOTTOM_RIGHT, "%d", 400);
         it.graph(graph_col_x, graph_y_current, id(co2_graph));
         graph_y_current += graph_height + graph_padding;
         it.printf(label_col_x, graph_y_current, fl14, id(grey), TextAlign::TOP_RIGHT, "µg/m³");
         it.printf(label_col_x, graph_y_current + graph_height / 2, fl14, id(white), TextAlign::CENTER_RIGHT, "PM1");
         it.graph(graph_col_x, graph_y_current, id(pm1_graph));
         graph_y_current += graph_height + graph_padding;
         it.printf(label_col_x, graph_y_current, fl14, id(grey), TextAlign::TOP_RIGHT, "µg/m³");
         it.printf(label_col_x, graph_y_current + graph_height / 2, fl14, id(white), TextAlign::CENTER_RIGHT, "PM2.5");
         it.graph(graph_col_x, graph_y_current, id(pm25_graph));
         graph_y_current += graph_height + graph_padding;
         it.printf(label_col_x, graph_y_current, fl14, id(grey), TextAlign::TOP_RIGHT, "µg/m³");
         it.printf(label_col_x, graph_y_current + graph_height / 2, fl14, id(white), TextAlign::CENTER_RIGHT, "PM10");
         it.graph(graph_col_x, graph_y_current, id(pm10_graph));
         graph_y_current += graph_height + graph_padding;
      } else if (current_main_display_mode == 2) {
         int graph_y_current = graph_y_start;
         int label_col_x = 80;
         int graph_col_x = 85;
         it.printf(label_col_x, graph_y_current, fl14, id(grey), TextAlign::TOP_RIGHT, "°C  %.1f", 30.0);
         it.printf(label_col_x, graph_y_current + graph_height / 2, fl14, id(white), TextAlign::CENTER_RIGHT, "Temp");
         it.printf(label_col_x, graph_y_current + graph_height - 1, fl14, id(grey), TextAlign::BOTTOM_RIGHT, "%.1f", 10.0);
         it.graph(graph_col_x, graph_y_current, id(temperature_graph));
         graph_y_current += graph_height + graph_padding;
         it.printf(label_col_x, graph_y_current, fl14, id(grey), TextAlign::TOP_RIGHT, "%%RH  %.0f", 100.0);
         it.printf(label_col_x, graph_y_current + graph_height / 2, fl14, id(white), TextAlign::CENTER_RIGHT, "Humidity");
         it.printf(label_col_x, graph_y_current + graph_height - 1, fl14, id(grey), TextAlign::BOTTOM_RIGHT, "%.0f", 0.0);
         it.graph(graph_col_x, graph_y_current, id(humidity_graph));
         graph_y_current += graph_height + graph_padding;
         it.printf(label_col_x, graph_y_current, fl14, id(grey), TextAlign::TOP_RIGHT, "hPa  %.0f", 1010.0);
         it.printf(label_col_x, graph_y_current + graph_height / 2, fl14, id(white), TextAlign::CENTER_RIGHT, "Pressure");
         it.printf(label_col_x, graph_y_current + graph_height - 1, fl14, id(grey), TextAlign::BOTTOM_RIGHT, "%.0f", 930.0);
         it.graph(graph_col_x, graph_y_current, id(pressure_graph));
         graph_y_current += graph_height + graph_padding;
         it.printf(label_col_x, graph_y_current, fl14, id(grey), TextAlign::TOP_RIGHT, "°C  %.1f", 25.0);
         it.printf(label_col_x, graph_y_current + graph_height / 2, fl14, id(white), TextAlign::CENTER_RIGHT, "Dewpoint");
         it.printf(label_col_x, graph_y_current + graph_height - 1, fl14, id(grey), TextAlign::BOTTOM_RIGHT, "%.1f", -10.0);
         it.graph(graph_col_x, graph_y_current, id(dew_point_graph));
         graph_y_current += graph_height + graph_padding;
         it.printf(label_col_x, graph_y_current, fl14, id(grey), TextAlign::TOP_RIGHT, "lx");
         it.printf(label_col_x, graph_y_current + graph_height / 2, fl14, id(white), TextAlign::CENTER_RIGHT, "Light");
         it.graph(graph_col_x, graph_y_current, id(light_graph));
         graph_y_current += graph_height + graph_padding;
      } else if (current_main_display_mode == 3) {
         auto cy_info = 10;
         it.print(w/2, cy_info, fl18, id(light_grey), TextAlign::TOP_CENTER, "Alarm Conditions");
         cy_info += fl18->get_height() + 3;
         it.printf(10, cy_info, fl14, id(white), TextAlign::TOP_LEFT, "- CO2 > %.0f ppm", id(co2_alarm_threshold).state);
         cy_info += fl14->get_height() + 1;
         it.printf(10, cy_info, fl14, id(white), TextAlign::TOP_LEFT, "- PM2.5 / PM10 > %.0f / %.0f µg/m³", id(pm25_alarm_threshold).state,
                   id(pm10_alarm_threshold).state);
         cy_info += fl14->get_height() + 1;
         it.print(10, cy_info, fl14, id(grey), TextAlign::TOP_LEFT, "after 5 min, only with Buzzer Alarm on");
         cy_info += fl14->get_height() + 5;
         it.print(w/2, cy_info, fl18, id(light_grey), TextAlign::TOP_CENTER, "Pages and Controls");
         cy_info += fl18->get_height() + 3;
         it.print(10, cy_info, fl14, id(white), TextAlign::TOP_LEFT, "- 1 values / 2 help");
         cy_info += fl14->get_height() + 1;
         it.print(10, cy_info, fl14, id(white), TextAlign::TOP_LEFT, "- 3 1h RAM / 4 air / 5 climate");
         cy_info += fl14->get_height() + 1;
         it.print(10, cy_info, fl14, id(white), TextAlign::TOP_LEFT, "- 6 air / 7 climate / 8 QR (24h)");
         cy_info += fl14->get_height() + 1;
         it.print(10, cy_info, fl14, id(white), TextAlign::TOP_LEFT, "- press: next page");
         cy_info += fl14->get_height() + 1;
         it.print(10, cy_info, fl14, id(white), TextAlign::TOP_LEFT, "- hold 5 s: print page");
         cy_info += fl14->get_height() + 1;
         it.print(10, cy_info, fl14, id(white), TextAlign::TOP_LEFT, "- idle 30 s: back to page 1");
      } else if (current_main_display_mode == 6) {
         int graph_y_current = graph_y_start;
         int label_col_x = 80;
         int graph_col_x = 85;
         int storage_graph_spacing = 2;
         int num_graphs_on_this_page = 5;
         int graph_height_storage = (footer_start_y - graph_y_start - (num_graphs_on_this_page-1) * storage_graph_spacing) / num_graphs_on_this_page;
         it.printf(label_col_x, graph_y_current, fl14, id(grey),  TextAlign::TOP_RIGHT, "KB  %.0f", 100.0);
         it.printf(label_col_x, graph_y_current + graph_height_storage / 2, fl14, id(white), TextAlign::CENTER_RIGHT, "Heap Free");
         it.printf(label_col_x, graph_y_current + graph_height_storage - 1, fl14, id(grey),  TextAlign::BOTTOM_RIGHT, "%.0f", 0.0);
         it.graph (graph_col_x, graph_y_current, id(heap_free_graph_1h));
         graph_y_current += graph_height_storage + storage_graph_spacing;
         it.printf(label_col_x, graph_y_current, fl14, id(grey),  TextAlign::TOP_RIGHT, "KB  %.0f", 64.0);
         it.printf(label_col_x, graph_y_current + graph_height_storage / 2, fl14, id(white), TextAlign::CENTER_RIGHT, "Heap Block");
         it.printf(label_col_x, graph_y_current + graph_height_storage - 1, fl14, id(grey),  TextAlign::BOTTOM_RIGHT, "%.0f", 0.0);
         it.graph (graph_col_x, graph_y_current, id(heap_max_block_graph_1h));
         graph_y_current += graph_height_storage + storage_graph_spacing;
         it.printf(label_col_x, graph_y_current, fl14, id(grey),  TextAlign::TOP_RIGHT, "KB  %.0f", 2000.0);
         it.printf(label_col_x, graph_y_current + graph_height_storage / 2, fl14, id(white), TextAlign::CENTER_RIGHT, "PSRAM");
         it.printf(label_col_x, graph_y_current + graph_height_storage - 1, fl14, id(grey),  TextAlign::BOTTOM_RIGHT, "%.0f", 1700.0);
         it.graph (graph_col_x, graph_y_current, id(free_psram_graph_1h));
         graph_y_current += graph_height_storage + storage_graph_spacing;
         it.printf(label_col_x, graph_y_current, fl14, id(grey),  TextAlign::TOP_RIGHT, "ms  %.0f", 250.0);
         it.printf(label_col_x, graph_y_current + graph_height_storage / 2, fl14, id(white), TextAlign::CENTER_RIGHT, "Loop Time");
         it.printf(label_col_x, graph_y_current + graph_height_storage - 1, fl14, id(grey),  TextAlign::BOTTOM_RIGHT, "%.0f", 100.0);
         it.graph (graph_col_x, graph_y_current, id(loop_time_graph_1h));
      } else if (current_main_display_mode == 4) {
         int graph_y_current = graph_y_start;
         int label_col_x = 80;
         int graph_col_x = 85;
         it.printf(label_col_x, graph_y_current, fl14, id(grey), TextAlign::TOP_RIGHT, "ppb");
         it.printf(label_col_x, graph_y_current + graph_height / 2, fl14, id(white), TextAlign::CENTER_RIGHT, "TVOC");
         it.graph(graph_col_x, graph_y_current, id(voc_graph_24h));
         graph_y_current += graph_height + graph_padding;
         it.printf(label_col_x, graph_y_current, fl14, id(grey), TextAlign::TOP_RIGHT, "ppm  %d", 3400);
         it.printf(label_col_x, graph_y_current + graph_height / 2, fl14, id(white), TextAlign::CENTER_RIGHT, "CO2");
         it.printf(label_col_x, graph_y_current + graph_height - 1, fl14, id(grey), TextAlign::BOTTOM_RIGHT, "%d", 400);
         it.graph(graph_col_x, graph_y_current, id(co2_graph_24h));
         graph_y_current += graph_height + graph_padding;
         it.printf(label_col_x, graph_y_current, fl14, id(grey), TextAlign::TOP_RIGHT, "µg/m³");
         it.printf(label_col_x, graph_y_current + graph_height / 2, fl14, id(white), TextAlign::CENTER_RIGHT, "PM1");
         it.graph(graph_col_x, graph_y_current, id(pm1_graph_24h));
         graph_y_current += graph_height + graph_padding;
         it.printf(label_col_x, graph_y_current, fl14, id(grey), TextAlign::TOP_RIGHT, "µg/m³");
         it.printf(label_col_x, graph_y_current + graph_height / 2, fl14, id(white), TextAlign::CENTER_RIGHT, "PM2.5");
         it.graph(graph_col_x, graph_y_current, id(pm25_graph_24h));
         graph_y_current += graph_height + graph_padding;
         it.printf(label_col_x, graph_y_current, fl14, id(grey), TextAlign::TOP_RIGHT, "µg/m³");
         it.printf(label_col_x, graph_y_current + graph_height / 2, fl14, id(white), TextAlign::CENTER_RIGHT, "PM10");
         it.graph(graph_col_x, graph_y_current, id(pm10_graph_24h));
         graph_y_current += graph_height + graph_padding;
      } else if (current_main_display_mode == 5) {
         int graph_y_current = graph_y_start;
         int label_col_x = 80;
         int graph_col_x = 85;
         it.printf(label_col_x, graph_y_current, fl14, id(grey), TextAlign::TOP_RIGHT, "°C  %.1f", 30.0);
         it.printf(label_col_x, graph_y_current + graph_height / 2, fl14, id(white), TextAlign::CENTER_RIGHT, "Temp");
         it.printf(label_col_x, graph_y_current + graph_height - 1, fl14, id(grey), TextAlign::BOTTOM_RIGHT, "%.1f", 10.0);
         it.graph(graph_col_x, graph_y_current, id(temperature_graph_24h));
         graph_y_current += graph_height + graph_padding;
         it.printf(label_col_x, graph_y_current, fl14, id(grey), TextAlign::TOP_RIGHT, "%%RH  %.0f", 100.0);
         it.printf(label_col_x, graph_y_current + graph_height / 2, fl14, id(white), TextAlign::CENTER_RIGHT, "Humidity");
         it.printf(label_col_x, graph_y_current + graph_height - 1, fl14, id(grey), TextAlign::BOTTOM_RIGHT, "%.0f", 0.0);
         it.graph(graph_col_x, graph_y_current, id(humidity_graph_24h));
         graph_y_current += graph_height + graph_padding;
         it.printf(label_col_x, graph_y_current, fl14, id(grey), TextAlign::TOP_RIGHT, "hPa  %.0f", 1010.0);
         it.printf(label_col_x, graph_y_current + graph_height / 2, fl14, id(white), TextAlign::CENTER_RIGHT, "Pressure");
         it.printf(label_col_x, graph_y_current + graph_height - 1, fl14, id(grey), TextAlign::BOTTOM_RIGHT, "%.0f", 930.0);
         it.graph(graph_col_x, graph_y_current, id(pressure_graph_24h));
         graph_y_current += graph_height + graph_padding;
         it.printf(label_col_x, graph_y_current, fl14, id(grey), TextAlign::TOP_RIGHT, "°C  %.1f", 25.0);
         it.printf(label_col_x, graph_y_current + graph_height / 2, fl14, id(white), TextAlign::CENTER_RIGHT, "Dewpoint");
         it.printf(label_col_x, graph_y_current + graph_height - 1, fl14, id(grey), TextAlign::BOTTOM_RIGHT, "%.1f", -10.0);
         it.graph(graph_col_x, graph_y_current, id(dew_point_graph_24h));
         graph_y_current += graph_height + graph_padding;
         it.printf(label_col_x, graph_y_current, fl14, id(grey), TextAlign::TOP_RIGHT, "lx");
         it.printf(label_col_x, graph_y_current + graph_height / 2, fl14, id(white), TextAlign::CENTER_RIGHT, "Light");
         it.graph(graph_col_x, graph_y_current, id(light_graph_24h));
         graph_y_current += graph_height + graph_padding;
      } else if (current_main_display_mode == 7) {
         auto current_ip = wifi::global_wifi_component->wifi_sta_ip_addresses()[0];
         char ip_buf[40];
         current_ip.str_to(ip_buf);
         char url_str[48];
         sprintf(url_str, "http://%s", ip_buf);
         id(webserver_qr).set_value(url_str);
         auto qr_matrix_size = id(webserver_qr).get_size();
         int max_scale_w = w / qr_matrix_size;
         int max_scale_h = (footer_start_y - (fl14->get_height() + 10)) / qr_matrix_size;
         int scale = max_scale_w < max_scale_h ? max_scale_w : max_scale_h;
         if (scale <= 0) scale = 1;
         auto drawn_qr_size = qr_matrix_size * scale;
         int qr_x = (w - drawn_qr_size) / 2;
         int qr_y = (footer_start_y - (fl14->get_height() + 10) - drawn_qr_size) / 2 + 10;
         id(webserver_qr).draw(&it, qr_x, qr_y, Color::WHITE, scale);
         it.print(w/2, footer_start_y - 10, fl14, id(grey), TextAlign::BOTTOM_CENTER, "Scan for Webserver");
      }
      int text_baseline_y = h - bottom_margin_val - 4;
      it.filled_rectangle(0, footer_start_y, w, bottom_bar_height, Color::BLACK);
      int displayed_page_number;
      if (current_main_display_mode == 0) displayed_page_number = 1;
      else if (current_main_display_mode == 3) displayed_page_number = 2;
      else if (current_main_display_mode == 6) displayed_page_number = 3;
      else if (current_main_display_mode == 1) displayed_page_number = 4;
      else if (current_main_display_mode == 2) displayed_page_number = 5;
      else if (current_main_display_mode == 4) displayed_page_number = 6;
      else if (current_main_display_mode == 5) displayed_page_number = 7;
      else if (current_main_display_mode == 7) displayed_page_number = 8;
      else displayed_page_number = 0;
      int total_pages = 8;
      if (current_main_display_mode == 0) {
        uint32_t current_time_ms = (uint32_t) (esp_timer_get_time() / 1000);
        if (current_time_ms - id(last_bottom_toggle_time) >= 10000) {
          id(display_mode_toggle) = 1 - id(display_mode_toggle);
          id(last_bottom_toggle_time) = current_time_ms;
        }
        int current_display_mode_bottom = id(display_mode_toggle);
        if (current_display_mode_bottom == 0) {
          auto now = id(esptime).now();
          if (now.is_valid()) {
            it.strftime(10, text_baseline_y, fl14, id(white), TextAlign::BOTTOM_LEFT, "%d.%m.%Y", now);
            it.strftime(w - 10, text_baseline_y, fl14, id(white), TextAlign::BOTTOM_RIGHT, "%H:%M", now);
          }
        } else {
          auto current_ip = wifi::global_wifi_component->wifi_sta_ip_addresses()[0];
          char ip_str[40];
          current_ip.str_to(ip_str);
          it.print(10, text_baseline_y, fl14, id(grey), TextAlign::BOTTOM_LEFT, App.get_name().c_str());
          it.print(w - 10, text_baseline_y, fl14, id(white), TextAlign::BOTTOM_RIGHT, ip_str);
        }
      } else if (current_main_display_mode == 1) {
          it.print(10, text_baseline_y, fl14, id(white), TextAlign::BOTTOM_LEFT, "VCPM");
          it.printf(w - 10, text_baseline_y, fl14, id(white), TextAlign::BOTTOM_RIGHT, "Graphs 1h");
      } else if (current_main_display_mode == 2) {
          it.print(10, text_baseline_y, fl14, id(white), TextAlign::BOTTOM_LEFT, "THPDL");
          it.printf(w - 10, text_baseline_y, fl14, id(white), TextAlign::BOTTOM_RIGHT, "Graphs 1h");
      } else if (current_main_display_mode == 3) {
          it.print(10, text_baseline_y, fl14, id(white), TextAlign::BOTTOM_LEFT, "Info Page");
          float altitude = id(calculated_altitude).state;
          if (isnan(altitude)) {
              it.print(w - 10, text_baseline_y, fl14, id(grey), TextAlign::BOTTOM_RIGHT, "-- m");
          } else {
              it.printf(w - 10, text_baseline_y, fl14, id(white), TextAlign::BOTTOM_RIGHT, "%.0f m", altitude);
          }
      } else if (current_main_display_mode == 6) {
          it.print(10, text_baseline_y, fl14, id(white), TextAlign::BOTTOM_LEFT, "RAM CPU");
          it.print(w - 10, text_baseline_y, fl14, id(white), TextAlign::BOTTOM_RIGHT, "Graphs 1h");
      } else if (current_main_display_mode == 4) {
          it.print(10, text_baseline_y, fl14, id(white), TextAlign::BOTTOM_LEFT, "VCPM");
          it.printf(w - 10, text_baseline_y, fl14, id(white), TextAlign::BOTTOM_RIGHT, "Graphs 24h");
      } else if (current_main_display_mode == 5) {
          it.print(10, text_baseline_y, fl14, id(white), TextAlign::BOTTOM_LEFT, "THPDL");
          it.printf(w - 10, text_baseline_y, fl14, id(white), TextAlign::BOTTOM_RIGHT, "Graphs 24h");
      } else if (current_main_display_mode == 7) {
          it.print(10, text_baseline_y, fl14, id(white), TextAlign::BOTTOM_LEFT, "QR Code");
      }
      char page_indicator_str[6];
      sprintf(page_indicator_str, "%d/%d", displayed_page_number, total_pages);
      it.print(w / 2, text_baseline_y, fl14, id(light_grey), TextAlign::BOTTOM_CENTER, page_indicator_str);
      };
      draw_screen(it);
      if (id(print_requested)) {
        id(print_requested) = false;
        auto &canvas = thermalprint::canvas();
        canvas.clear_bits();
        canvas.set_ink_threshold(id(print_ink_threshold).state);
        draw_screen(canvas);
        auto now = id(esptime).now();
        thermalprint::Options opt;  // "Print ..." entities in the web UI, section "Printer"
        opt.large = id(print_size).active_index().value_or(1) == 1;
        opt.header = id(print_header).state;
        opt.feed_lines = id(print_feed_lines).state;
        thermalprint::start(id(printer_host).state, ${printer_port}, App.get_friendly_name().c_str(),
                            now.is_valid() ? now.strftime("%d.%m.%Y  %H:%M") : std::string(), opt);
        id(print_seen_state) = -1;
      }
      // Print result box, drawn after the printer copy so it only shows on the screen.
      if (id(print_toast) != 0) {
        bool sent = id(print_toast) == 1;
        auto color = sent ? id(green) : id(red);
        int bw = 190, bh = 50;
        int bx = (it.get_width() - bw) / 2, by = (it.get_height() - bh) / 2;
        it.filled_rectangle(bx, by, bw, bh, Color::BLACK);
        it.rectangle(bx, by, bw, bh, color);
        it.rectangle(bx + 1, by + 1, bw - 2, bh - 2, color);
        it.print(bx + bw / 2, by + bh / 2, id(font_value_30), color, TextAlign::CENTER,
                 sent ? "Copy sent" : "Send failed");
      }
    dimensions:
      height: 320
      width: 240

# interfaces
uart:
  - tx_pin: GPIO10
    rx_pin: GPIO09
    baud_rate: 9600
    id: uart_ze08
    parity: none
    data_bits: 8
    stop_bits: 1
    debug: 
      direction: BOTH
      dummy_receiver: true
      after:
        # bytes: 9 
        timeout: 10ms
      sequence:
        - lambda: |-
            //UARTDebug::log_int(direction, bytes, ',');
            //UARTDebug::log_hex(direction, bytes, ',');
            if (direction == UART_DIRECTION_RX)                      
              {
                  if (bytes.size() == 9)                               
                    {
                        if ( bytes[0] == 0xFF &&
                            bytes[1] == 0x17
                            )       
                          {
                            float value = float((bytes[4] * 256) + bytes[5]);
                            id(ch2o_ze08).publish_state(value);
                          }
                    }
              }

  - tx_pin: GPIO08
    rx_pin: GPIO07
    baud_rate: 9600
    id: uart_pms

spi:
  # Gets SPI2 (the only ESPHome SPI bus); sd_logger.h uses SPI3 for the SD card, so don't add a second bus here.
  - id: display_spi_bus
    clk_pin: GPIO01
    mosi_pin: GPIO02
    miso_pin: GPIO16

i2c:
  - sda: GPIO11
    scl: GPIO12
    scan: true
    id: i2c_1
    frequency: 100kHz

  - sda: GPIO17
    scl: GPIO18
    scan: true
    id: i2c_2
    frequency: 100kHz

# BME680 via Bosch BSEC2 (IAQ). License: private use only, don't distribute firmware binaries built with it.
bme68x_bsec2_i2c:
  - id: bme680_bsec
    i2c_id: i2c_1
    address: 0x77
    model: bme680
    supply_voltage: 3.3V
    # Gas heater + IAQ every 5 min: less self-heating of the temperature reference than LP (3 s).
    sample_rate: ULP
    operating_age: 28d
    # Calibration state to flash; 1h instead of 6h so a reboot or flash loses at most an hour of learning.
    state_save_interval: 1h

# sensors
sensor:
  # SD card free space (sd_logger.h); NaN while no card is mounted.
  - platform: template
    name: "SD Card Free"
    icon: "mdi:sd"
    entity_category: diagnostic
    web_server:
      sorting_group_id: web_group_sd_card
      sorting_weight: 2
    unit_of_measurement: "MB"
    accuracy_decimals: 0
    update_interval: 10min
    lambda: |-
      return sdlog::free_mb();

  # Template Sensors
  - platform: template
    name: "ZE08 CH2O"
    unit_of_measurement: ppb
    state_class: measurement
    device_class: volatile_organic_compounds
    id: ch2o_ze08
    icon: "mdi:gas-cylinder"
    filters: 
      - filter_out: 2000.0
      # The ZE08 datasheet specifies no accuracy at all (only a resolution of ≤0.01 ppm), its protocol has no
      # zero-point command, and the manufacturer warns that the zero drifts after long exposure to organic
      # gases. The reading is therefore only a relative value: "CH2O Offset" is subtracted here (like the
      # temperature offsets) and is set in fresh air with the "Zero CH2O (fresh air)" button.
      - offset: !lambda return -id(ch2o_offset).state;
      - exponential_moving_average:
          send_every: 30
          alpha: 0.5

  - platform: template
    name: "SHT41 Dewpoint"
    unit_of_measurement: "°C"
    state_class: measurement
    device_class: temperature
    id: dew_point_sensor
    icon: "mdi:water-thermometer"
    lambda: |-
      float temperature = id(temp_sht41).state;
      float humidity = id(hum_sht41).state;
      if (isnan(temperature) || isnan(humidity)) {
        return NAN;
      }
      float a = 17.27;
      float b = 237.7;
      float alpha = ((a * temperature) / (b + temperature)) + log(humidity / 100.0);
      return (b * alpha) / (a - alpha);
    update_interval: 44s

  # Reference dew point (BME680 is the temperature/humidity reference); used by the display and graphs.
  - platform: template
    name: "BME680 Dewpoint"
    unit_of_measurement: "°C"
    state_class: measurement
    device_class: temperature
    id: dew_point_bme680
    icon: "mdi:water-thermometer"
    lambda: |-
      float temperature = id(temp_bme680).state;
      float humidity = id(hum_bme680).state;
      if (isnan(temperature) || isnan(humidity)) {
        return NAN;
      }
      float a = 17.27;
      float b = 237.7;
      float alpha = ((a * temperature) / (b + temperature)) + log(humidity / 100.0);
      return (b * alpha) / (a - alpha);
    update_interval: 44s

  - platform: template
    name: "Calculated Absolute Humidity"
    id: calculated_absolute_humidity
    icon: "mdi:water-percent"
    unit_of_measurement: "g/m³"
    update_interval: 48s
    lambda: |-
      float t = NAN;
      float rh = NAN;
      if (!isnan(id(temp_bme680).state) && !isnan(id(hum_bme680).state)) {
        t = id(temp_bme680).state;
        rh = id(hum_bme680).state;
      }
      else if (!isnan(id(temp_sht41).state) && !isnan(id(hum_sht41).state)) {
        t = id(temp_sht41).state;
        rh = id(hum_sht41).state;
      }
      else {
        float temps[2] = {id(temp_scd40).state, id(temp_aht21_ens).state};
        float hums[2] = {id(hum_scd40).state, id(hum_aht21_ens).state};
        for(int i = 0; i < 2; i++) {
          if(!isnan(temps[i]) && !isnan(hums[i])) {
            t = temps[i];
            rh = hums[i];
            break;
          }
        }
      }
      if (isnan(t) || isnan(rh)) return NAN;
      float svp = 6.112 * exp((17.67 * t) / (t + 243.5));
      float avp = svp * (rh / 100.0);
      float abs_humidity = 216.7 * avp / (273.15 + t);
      return abs_humidity;

  # Select best sensor
  - platform: template
    name: "Best Temperature"
    id: best_temperature
    icon: "mdi:thermometer"
    unit_of_measurement: "°C"
    accuracy_decimals: 1
    lambda: |-
      float temps[4] = {id(temp_bme680).state, id(temp_sht41).state, id(temp_scd40).state, id(temp_aht21_ens).state};
      float selected_temp = NAN;
      for(int i = 0; i < 4; i++){
        if(!isnan(temps[i])){
          selected_temp = temps[i];
          break;
        }
      }
      return selected_temp;

  - platform: template
    name: "Calculated Altitude"
    id: calculated_altitude
    unit_of_measurement: "m"
    state_class: "measurement"
    icon: "mdi:mountain"
    update_interval: 15min
    lambda: |-
      float local_pressure = NAN;
      if (id(pres_bme680).has_state()) {
          local_pressure = id(pres_bme680).state;
      }
      float local_temperature = NAN;
      if (id(temp_bme680).has_state()) {
          local_temperature = id(temp_bme680).state;
      }
      float sea_level_pressure_ref = id(manual_sea_level_pressure).state;  // Deklaration und Initialisierung
      if (!isnan(local_pressure) && !isnan(local_temperature) && !isnan(sea_level_pressure_ref)) {
          if (local_pressure > 0 && sea_level_pressure_ref > 0) {
              float altitude = (pow(sea_level_pressure_ref / local_pressure, 1.0/5.257) - 1.0) * (local_temperature + 273.15) / 0.0065;
              return altitude;
          }
      }
      return NAN;

  - platform: template
    name: "ENS160 Warmup Max Remaining"
    id: ens160_warmup_remaining
    icon: "mdi:timer-sand"
    unit_of_measurement: "min"
    state_class: "measurement"
    accuracy_decimals: 0
    update_interval: 10s
    lambda: |-
      // ESPHome docs: 1 h after the very first power-up, about 3 min after a reboot. The flag is cleared
      // by the first valid reading, so the upper bound matches whichever case applies.
      if (id(eco2_ens160).has_state()) {
        id(ens160_cold_start) = false;
        return 0;
      }
      int limit = id(ens160_cold_start) ? 60 : 3;
      int64_t elapsed_min = esp_timer_get_time() / 60000000LL;
      if (elapsed_min >= limit) return 0;
      return limit - (int) elapsed_min;

  # 12 h learning time of the SGP30; 0 from the moment the baseline counts as stored.
  - platform: template
    name: "SGP30 Warmup Max Remaining"
    id: sgp30_warmup_remaining
    icon: "mdi:timer-sand"
    unit_of_measurement: "min"
    state_class: "measurement"
    accuracy_decimals: 0
    update_interval: 10s
    lambda: |-
      // Counts the current uptime window, not a stored flag: ESPHome restarts the 12 h on every boot and
      // only writes the baseline to flash after a full window. 0 = window complete.
      if (!id(sgp30_baseline_saved) && id(tvoc_sgp30).has_state() &&
          esp_timer_get_time() >= 12LL * 3600LL * 1000000LL) {
        id(sgp30_baseline_saved) = true;
      }
      int64_t elapsed_min = esp_timer_get_time() / 60000000LL;
      if (elapsed_min >= 720) return 0;
      return 720 - (int) elapsed_min;
      
  # Debug Sensors
  - platform: debug
    free:
      name: "Heap Free (Bytes)"
      id: heap_free
      disabled_by_default: True
    block:
      name: "Heap Max Block (Bytes)"
      id: heap_block
      disabled_by_default: True
    psram:
      name: "PSRAM Free (Bytes)"
      id: free_psram
      disabled_by_default: True
    loop_time:
      name: "Loop Time"
      id: loop_time
      disabled_by_default: False
    cpu_frequency:
      name: "CPU Frequency"
      id: cpu_frequency
      disabled_by_default: True

  - platform: template
    name: "Heap Free (KB)"
    id: heap_free_kb
    icon: "mdi:memory"
    unit_of_measurement: "KB"
    entity_category: diagnostic
    accuracy_decimals: 0
    lambda: |-
      if (isnan(id(heap_free).state)) return NAN;
      return id(heap_free).state / 1024.0;

  - platform: template
    name: "Heap Max Block (KB)"
    id: heap_max_block_kb
    icon: "mdi:memory"
    entity_category: diagnostic
    unit_of_measurement: "KB"
    accuracy_decimals: 0
    lambda: |-
      if (isnan(id(heap_block).state)) return NAN;
      return id(heap_block).state / 1024.0;

  - platform: template
    name: "PSRAM Free (KB)"
    id: free_psram_kb
    icon: "mdi:memory"
    entity_category: diagnostic
    unit_of_measurement: "KB"
    accuracy_decimals: 0 
    lambda: |-
      if (isnan(id(free_psram).state)) return NAN;
      return id(free_psram).state / 1024.0;

  - platform: uptime
    name: "Uptime (Seconds)"
    id: uptime_sensor
    icon: "mdi:update"
    entity_category: diagnostic
    update_interval: 55s
    disabled_by_default: True

  - platform: template
    name: "Uptime (Minutes)"
    id: uptime_minutes
    icon: "mdi:update"
    entity_category: diagnostic
    unit_of_measurement: "min"
    accuracy_decimals: 0
    lambda: |-
      if (isnan(id(uptime_sensor).state)) return NAN;
      return id(uptime_sensor).state / 60.0;

  - platform: wifi_signal
    name: "WiFi Strength"
    entity_category: diagnostic
    icon: "mdi:wifi"
    update_interval: 60s

  - platform: template
    name: "CPU Frequency MHz"
    icon: "mdi:cpu-32-bit"
    entity_category: diagnostic
    unit_of_measurement: "MHz"
    lambda: |-
      if (id(cpu_frequency).has_state()) {
        float freq = id(cpu_frequency).state;
        if (freq > 0) {
          return {static_cast<float>(round(freq / 1000000 * 100) / 100)};
        } else {
          return {NAN};
        }
      } else {
        return {NAN};
      }
    update_interval: 66s

  # I2C 1 Bus
  - platform: sht4x
    address: 0x44
    i2c_id: i2c_1
    temperature:
      name: "SHT41 Temperature"
      id: temp_sht41
      icon: "mdi:thermometer"
      filters:
        - offset: !lambda return id(temp_sht41_offset).state;
    humidity:
      name: "SHT41 Relative Humidity"
      id: hum_sht41
      icon: "mdi:water-percent"
      filters:
        - offset: !lambda return id(hum_sht41_offset).state;
    precision: High
    update_interval: 79s

  - platform: scd4x
    id: scd4x_chip
    address: 0x62
    i2c_id: i2c_1
    co2:
      name: "SCD40 CO2"
      id: co2_scd40
      icon: "mdi:molecule-co2"
    temperature:
      name: "SCD40 Temperature"
      id: temp_scd40
      icon: "mdi:thermometer"
      filters:
        - offset: !lambda return id(temp_scd40_offset).state;
    humidity:
      name: "SCD40 Humidity"
      id: hum_scd40
      icon: "mdi:water-percent"
      filters:
        - offset: !lambda return id(hum_scd40_offset).state;
    # ESPHome's default is 4 °C; the chip applies it before this config's own "SCD40 Temperature Offset"
    # filter, so the two never stack. Explicit so a default change upstream can't silently shift readings.
    temperature_offset: 4
    automatic_self_calibration: true
    ambient_pressure_compensation_source: pres_bme680
    update_interval: 33s

  - platform: sgp30
    id: sgp30_chip
    i2c_id: i2c_1
    address: 0x58
    eco2:
      name: "SGP30 eCO2"
      id: eco2_sgp30
      icon: "mdi:molecule-co2"
      accuracy_decimals: 0
      filters: 
        - exponential_moving_average: 
            send_every: 1
            alpha: 0.2
    tvoc:
      name: "SGP30 TVOC"
      id: tvoc_sgp30
      accuracy_decimals: 1
      filters: 
        - exponential_moving_average: 
            send_every: 1
            alpha: 0.2
    store_baseline: yes
    update_interval: 36s
    # SHT41: the most accurate temperature/humidity sensor in the box.
    compensation:
      humidity_source: hum_sht41
      temperature_source: temp_sht41

  # Not populated in this box: there is no SGP41 at 0x59, so setup logs "Get serial number failed" and the
  # component is marked FAILED on every boot; both entities stay unavailable. The block is kept for a later
  # upgrade — comment it out if the chip won't be fitted.
  - platform: sgp4x
    i2c_id: i2c_1
    #address: 0x59
    voc_index:
      name: "SGP41 VOC Index"
      id: aqi_voc_sgp41
      disabled_by_default: True
      icon: "mdi:radiator"
      device_class: aqi
      state_class: measurement
      unit_of_measurement: "index points"
    nox_index:
      name: "SGP41 NOx Index"
      id: aqi_nox_sgp41
      disabled_by_default: True
      icon: "mdi:radiator"
      device_class: aqi
      state_class: measurement
      unit_of_measurement: "index points"
    # SHT41: the most accurate temperature/humidity sensor in the box.
    compensation:
      humidity_source: hum_sht41
      temperature_source: temp_sht41
    store_baseline: True
    update_interval: 41s

  - platform: ltr390
    id: uv_light_ltr390
    address: 0x53
    i2c_id: i2c_1
    uv_index:
      name: "LTR390 UV Index"
      id: uv_index_ltr390
      icon: "mdi:sun-wireless-outline"
      # The datasheet's 2300 counts/UVI only hold for gain X18 at 20 bit; ESPHome scales other combinations
      # linearly. Applied here as a multiplier, which is what the datasheet's WFAC does to lux and UVI alike.
      filters:
        - multiply: !lambda return id(ltr_wfac).state;
    light:
      name: "LTR390 Ambient Light"
      icon: "mdi:weather-sunny"
      id: ambient_light_ltr390
      filters:
        - multiply: !lambda return id(ltr_wfac).state;
      on_value:
        then:
          - script.execute: adjust_backlight_based_on_light
    gain:
      ambient_light: X3
      uv: X18
    resolution:
      ambient_light: 18
      uv: 20
    update_interval: 11s

  # All outputs follow the hub's ULP rate (every 5 min). Per-sensor LP with a ULP hub fails at setup:
  # BSEC2 status 14 = BSEC_W_SU_SAMPLERATEMISMATCH.
  - platform: bme68x_bsec2
    bme68x_bsec2_id: bme680_bsec
    temperature:
      name: "BME680 Temperature"
      id: temp_bme680
      icon: "mdi:thermometer"
      filters:
        - offset: !lambda return id(temp_bme680_offset).state;
    pressure:
      name: "BME680 Pressure"
      id: pres_bme680
      icon: "mdi:mountain"
    humidity:
      name: "BME680 Humidity"
      id: hum_bme680
      icon: "mdi:water-percent"
      filters:
        - offset: !lambda return id(hum_bme680_offset).state;
    gas_resistance:
      name: "BME680 Gas Resistance"
      id: gas_resistance_bme680
      icon: "mdi:omega"
    iaq:
      name: "BME680 Indoor Air Quality"
      id: iaq_bme680
      icon: "mdi:gauge"
    iaq_static:
      name: "BME680 Static IAQ"
      id: iaq_static_bme680
      icon: "mdi:gauge"
    co2_equivalent:
      name: "BME680 CO2 Equivalent"
      id: co2eq_bme680
      icon: "mdi:molecule-co2"
    breath_voc_equivalent:
      name: "BME680 Breath VOC Equivalent"
      id: bvoc_bme680
      icon: "mdi:air-filter"

  # I2C 2 Bus
  - platform: aht10
    address: 0x38
    i2c_id: i2c_2
    variant: AHT20
    temperature:
      name: "AHT21 ENS160 Temperature"
      id: temp_aht21_ens
      icon: "mdi:thermometer"
      disabled_by_default: false
      filters:
        - offset: !lambda return id(temp_aht21_ens_offset).state;
    humidity:
      name: "AHT21 ENS160 Humidity"
      id: hum_aht21_ens
      icon: "mdi:water-percent"
      disabled_by_default: false
      filters:
        - offset: !lambda return id(hum_aht21_ens_offset).state;
    update_interval: 73s

  - platform: ens160_i2c
    id: ens160_chip
    address: 0x53
    i2c_id: i2c_2
    eco2:
      name: "ENS160 eCO2"
      id: eco2_ens160
      icon: "mdi:molecule-co2"
    tvoc:
      name: "ENS160 TVOC"
      id: tvoc_ens160
      filters: 
        - exponential_moving_average: 
            send_every: 1
            alpha: 0.5
    aqi:
      name: "ENS160 Air Quality Index"
      id: aqi_ens160
    update_interval: 17s
    # SHT41: the most accurate temperature/humidity sensor in the box (the AHT21 next to the ENS160 reads its heat).
    compensation:
      temperature: temp_sht41
      humidity: hum_sht41

  # Serial Bus
  - platform: pmsx003
    type: PMSX003
    # 30 s keeps the fan and laser running continuously. Above 30 s ESPHome sleeps the sensor between
    # readings and wakes it 30 s early (30 s on, 90 s off at 120 s); the PMS keeps that state across an
    # ESP reboot and once stayed asleep, with all three values at NA until a mains power cycle.
    update_interval: 30s
    uart_id: uart_pms
    pm_1_0:
      name: "PMS Particulate Matter <1.0µm Concentration"
      id: pm1_pms
    pm_2_5:
      name: "PMS Particulate Matter <2.5µm Concentration"
      id: pm25_pms
    pm_10_0:
      name: "PMS Particulate Matter <10.0µm Concentration"
      id: pm10_pms

  # Fan speed 0-6 that "Filter Auto" sends to the air filter; empty until the first PM2.5 reading.
  - platform: template
    name: "Filter Target Speed"
    id: filter_target_speed
    icon: "mdi:fan"
    entity_category: diagnostic
    accuracy_decimals: 0
    web_server:
      sorting_group_id: web_group_filter
      sorting_weight: 2

# Buzzer with Auto Alert
switch:
  # Screen print (thermal_print.h): box name and date above the image.
  - platform: template
    name: "Print Header"
    id: print_header
    icon: "mdi:format-header-1"
    entity_category: config
    web_server:
      sorting_group_id: web_group_printer
      sorting_weight: 5
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
  # Air filter control: sets the filter's fan speed from PM2.5 (script filter_control). When off, the fan
  # keeps its current speed, so the filter can be set by hand.
  - platform: template
    name: "Filter Auto"
    id: filter_auto
    icon: "mdi:fan-auto"
    web_server:
      sorting_group_id: web_group_filter
      sorting_weight: 1
    optimistic: true
    # Off on first start, so it doesn't fight another controller still running on the filter.
    restore_mode: RESTORE_DEFAULT_OFF
    # Send right away, even if the speed hasn't changed.
    on_turn_on:
      - lambda: id(filter_sent_speed) = -1;
      - script.execute: filter_control
  - platform: template
    name: "Buzzer"
    id: buzzer_switch
    icon: "mdi:alarm-light-outline"
    optimistic: true
    turn_on_action:
      - output.turn_on: buzzer_output
      - output.ledc.set_frequency:
          id: buzzer_output
          frequency: "2441Hz"
      - output.set_level:
          id: buzzer_output
          level: "75%"
    turn_off_action:
      - output.turn_off: buzzer_output

  - platform: template
    name: "Buzzer Alarm"
    id: buzzer_alarm_enable_switch
    entity_category: config
    icon: "mdi:alarm-light"
    optimistic: true
    lambda: |-
      return id(buzzer_alarm_enabled);
    turn_on_action:
      - lambda: |-
          id(buzzer_alarm_enabled) = true;
          ESP_LOGD("Buzzer", "Buzzer Alarm enabled");
    turn_off_action:
      - lambda: |-
          id(buzzer_alarm_enabled) = false;
          ESP_LOGD("Buzzer", "Buzzer Alarm disabled");

  - platform: restart
    name: ${name} restart
    entity_category: diagnostic

# Buttons
button:
  # Factory Reset
  - platform: factory_reset
    name: "Factory Reset"
    entity_category: diagnostic
  # Save Mode
  - platform: safe_mode
    name: "Safe Mode"
    entity_category: diagnostic
  # SD card (sd_logger.h): unmount before pulling the card (wait for "Not mounted (safe to remove)"; the
  # sdlog task handles the request after a row in progress), mount after inserting it.
  - platform: template
    name: "SD Card Mount"
    icon: "mdi:sd"
    entity_category: config
    web_server:
      sorting_group_id: web_group_sd_card
      sorting_weight: 3
    on_press:
      - lambda: sdlog::request_mount();
  - platform: template
    name: "SD Card Unmount"
    icon: "mdi:eject"
    entity_category: config
    web_server:
      sorting_group_id: web_group_sd_card
      sorting_weight: 4
    on_press:
      - lambda: sdlog::request_unmount();
  # Air filter: the four speed limits back to their defaults (10 / 50 µg/m³ PM2.5, 800 / 2000 ppb TVOC).
  # Needed because the numbers are restored from flash: a changed default in this file only reaches a box
  # that has never stored a value. The speeds are also re-evaluated right away instead of on the next 30 s tick.
  - platform: template
    name: "Filter Thresholds Reset"
    id: filter_thresholds_reset
    icon: "mdi:backup-restore"
    entity_category: config
    web_server:
      sorting_group_id: web_group_filter
      sorting_weight: 15
    on_press:
      - number.set:
          id: filter_pm_start
          value: 10
      - number.set:
          id: filter_pm_full
          value: 50
      - number.set:
          id: filter_tvoc_start
          value: 800
      - number.set:
          id: filter_tvoc_full
          value: 2000
      - lambda: |-
          // -1 makes airfilter::speed_for() recompute the level from scratch instead of keeping the
          // hysteresis state of the old thresholds.
          id(filter_speed_pm) = -1;
          id(filter_speed_tvoc) = -1;
      - script.execute: filter_control
      - component.update: filter_steps
  # Calibration: set every temperature or humidity offset from the "Reference ..." value (script calibrate_offsets).
  - platform: template
    name: "Calibrate Temperature"
    icon: "mdi:thermometer-check"
    entity_category: config
    web_server:
      sorting_group_id: web_group_calibration
      sorting_weight: 3
    on_press:
      - script.execute:
          id: calibrate_offsets
          humidity: false
  - platform: template
    name: "Calibrate Humidity"
    icon: "mdi:water-check"
    entity_category: config
    web_server:
      sorting_group_id: web_group_calibration
      sorting_weight: 4
    on_press:
      - script.execute:
          id: calibrate_offsets
          humidity: true
  # ZE08-CH2O zero point: the sensor has a fixed offset that drifts. Run the box in fresh air for a few
  # minutes, then press this to subtract the current reading, so display, colour steps and log start at 0.
  - platform: template
    name: "Zero CH2O (fresh air)"
    icon: "mdi:gas-cylinder"
    entity_category: config
    web_server:
      sorting_group_id: web_group_calibration
      sorting_weight: 7
    on_press:
      - lambda: |-
          float corrected = id(ch2o_ze08).state;
          if (std::isnan(corrected))
            return;
          // corrected = raw - offset, so adding the corrected reading to the offset makes the next one 0.
          id(ch2o_offset).make_call().set_value(id(ch2o_offset).state + corrected).perform();
  # SCD40 CO2: forced recalibration against fresh air. Sensirion requires running the sensor in the mode used
  # later for more than 3 minutes in fresh air (~400-450 ppm) before this; 420 ppm is the current global
  # monthly mean. Automatic self calibration stays enabled.
  - platform: template
    name: "Calibrate SCD40 CO2 (420 ppm)"
    icon: "mdi:molecule-co2"
    entity_category: config
    web_server:
      sorting_group_id: web_group_calibration
      sorting_weight: 6
    on_press:
      - scd4x.perform_forced_calibration:
          id: scd4x_chip
          value: 420
      - lambda: |-
          id(calibration_status).publish_state("CO2: forced calibration to 420 ppm");
  # Same as holding the top button for 5 s.
  - platform: template
    name: "Print Screen"
    icon: "mdi:printer-pos"
    web_server:
      sorting_group_id: web_group_printer
      sorting_weight: 3
    on_press:
      - script.execute: print_screen

# Intervals
interval:
  # Screen print status: publish on change; when a print finished, show the result on the screen for 3 s
  # (two beeps when it failed).
  - interval: 500ms
    then:
      - lambda: |-
          int state = thermalprint::state;
          if (state == id(print_seen_state)) return;
          id(print_seen_state) = state;
          id(printer_status).publish_state(thermalprint::status_text());
          if (state != thermalprint::DONE && state != thermalprint::FAILED) return;
          if (state == thermalprint::FAILED) id(print_error_beep).execute();
          id(print_toast) = state == thermalprint::DONE ? 1 : 2;
          id(display_main).update();
          App.scheduler.set_timeout(id(display_main), "print_toast", 3000, []() {
            id(print_toast) = 0;
            id(display_main).update();
          });
  # Air filter: fan speed from PM2.5 and TVOC.
  - interval: 30s
    then:
      - script.execute: filter_control
  # Air filter request status: publish on change.
  - interval: 1s
    then:
      - lambda: |-
          int state = airfilter::state;
          if (state == id(filter_seen_state)) return;
          id(filter_seen_state) = state;
          id(filter_status).publish_state(airfilter::status_text());
  # PMS watchdog: while the sensor reports nothing (asleep or wedged) resend the wake-up frames every 5 min.
  # Once frames arrive the state becomes a number and this stops on its own.
  # startup_delay: without it the interval fires once right at boot, so the WARN and the extra wake frames
  # duplicate the on_boot wake-up that already ran two seconds earlier.
  - interval: 300s
    startup_delay: 300s
    then:
      - if:
          condition:
            lambda: return isnan(id(pm1_pms).state);
          then:
            - logger.log:
                level: WARN
                format: "PMS still silent, resending wake-up frames"
            - script.execute: pms_wake
  # SD card log: one CSV row per minute into /sdcard/YYYYMMDD.CSV.
  - interval: 60s
    then:
      - lambda: |-
          if (!sdlog::is_mounted()) return;
          auto now = id(esptime).now();
          if (!now.is_valid()) return;
          static const char *const header =
              "time,bme680_t,bme680_rh,bme680_p,bme680_gas,bme680_iaq,bme680_iaq_acc,bme680_iaq_static,"
              "bme680_co2eq,bme680_bvoc,scd40_co2,scd40_t,scd40_rh,sgp30_eco2,sgp30_tvoc,"
              "ens160_eco2,ens160_tvoc,ens160_aqi,ze08_ch2o,pm1,pm25,pm10,lux,uvi,"
              "sht41_t,sht41_rh,aht21_t,aht21_rh,dew_bme680,dew_sht41,abs_hum";
          char date[16];
          now.strftime(date, sizeof(date), "%Y%m%d");
          sdlog::Row row;
          now.strftime(row.buf, sizeof(row.buf), "%Y-%m-%d %H:%M:%S");
          row.len = strlen(row.buf);
          row.num(id(temp_bme680).state, 2);
          row.num(id(hum_bme680).state, 2);
          row.num(id(pres_bme680).state, 1);
          row.num(id(gas_resistance_bme680).state, 0);
          row.num(id(iaq_bme680).state, 0);
          row.text(id(iaq_accuracy_bme680).state);
          row.num(id(iaq_static_bme680).state, 0);
          row.num(id(co2eq_bme680).state, 0);
          row.num(id(bvoc_bme680).state, 2);
          row.num(id(co2_scd40).state, 0);
          row.num(id(temp_scd40).state, 2);
          row.num(id(hum_scd40).state, 2);
          row.num(id(eco2_sgp30).state, 0);
          row.num(id(tvoc_sgp30).state, 0);
          row.num(id(eco2_ens160).state, 0);
          row.num(id(tvoc_ens160).state, 0);
          row.num(id(aqi_ens160).state, 0);
          row.num(id(ch2o_ze08).state, 1);
          row.num(id(pm1_pms).state, 0);
          row.num(id(pm25_pms).state, 0);
          row.num(id(pm10_pms).state, 0);
          row.num(id(ambient_light_ltr390).state, 1);
          row.num(id(uv_index_ltr390).state, 2);
          row.num(id(temp_sht41).state, 2);
          row.num(id(hum_sht41).state, 2);
          row.num(id(temp_aht21_ens).state, 2);
          row.num(id(hum_aht21_ens).state, 2);
          row.num(id(dew_point_bme680).state, 2);
          row.num(id(dew_point_sensor).state, 2);
          row.num(id(calculated_absolute_humidity).state, 2);
          sdlog::log_row(date, header, row);

  # SD card: retry mounting every 10 min while no card is mounted (card inserted later, or pulled
  # without unmounting). Runs in the sdlog task, so a slow or stuck card doesn't block the loop.
  - interval: 10min
    then:
      - lambda: |-
          if (!sdlog::is_mounted()) sdlog::request_mount();

  - interval: 10s
    then:
      - if:
          condition:
            lambda: |-
              static const uint32_t ALARM_DELAY_MS = 5UL * 60UL * 1000UL;
              if (!id(buzzer_alarm_enabled)) {
                id(alarm_above_since) = 0;
                return false;
              }
              // Only CO2, PM2.5 and PM10 have a health-based limit; CH2O and TVOC stay on the display only.
              bool above = (id(co2_scd40).state > id(co2_alarm_threshold).state) ||
                           (id(pm25_pms).state > id(pm25_alarm_threshold).state) ||
                           (id(pm10_pms).state > id(pm10_alarm_threshold).state);
              if (!above) {
                id(alarm_above_since) = 0;
                return false;
              }
              uint32_t now = millis();
              if (id(alarm_above_since) == 0) {
                id(alarm_above_since) = now == 0 ? 1 : now;
                return false;
              }
              return (uint32_t) (now - id(alarm_above_since)) >= ALARM_DELAY_MS;
          then:
            - switch.turn_on: buzzer_switch
            - delay: 1s
            - switch.turn_off: buzzer_switch

  - interval: 10s
    then:
      - lambda: |-
          uint32_t last_press_time = id(last_button_press_timestamp);
          uint32_t current_time = esp_timer_get_time() / 1000000ULL;
          uint32_t time_since_last_button_press = current_time - last_press_time;
          int current_mode = id(main_display_mode);
          if (time_since_last_button_press >= 30 && current_mode != 0) {
            id(main_display_mode) = 0;
            id(display_main).update();
          }

# Timestamp-Service
time:
  - platform: sntp
    id: esptime
    timezone: "Europe/Berlin"
    servers: "pool.ntp.org"

# Scripts
script:
  # PMS5003 wake-up and active mode (manual v2.3, appendix II): 42 4D | CMD | DATAH | DATAL | LRC, where LRC
  # is the sum of the first five bytes. E4 00 01 = wake up, E1 00 01 = active mode (continuous frames).
  # A sensor that is already awake simply stays awake, so sending this is always safe.
  - id: pms_wake
    mode: single
    then:
      - uart.write:
          id: uart_pms
          data: [0x42, 0x4D, 0xE4, 0x00, 0x01, 0x01, 0x74]
      - delay: 300ms
      - uart.write:
          id: uart_pms
          data: [0x42, 0x4D, 0xE1, 0x00, 0x01, 0x01, 0x71]
  # Screen print (thermal_print.h): the next display update draws the page into the printer canvas too.
  - id: print_screen
    mode: single
    then:
      - if:
          condition:
            lambda: return thermalprint::busy();
          then:
            - logger.log:
                level: WARN
                format: "Screen print ignored: previous print still sending"
            - script.execute: print_error_beep
          else:
            - lambda: |-
                id(print_requested) = true;
                App.scheduler.set_timeout(id(display_main), "print_screen", 0, []() { id(display_main).update(); });
            - script.execute: print_beep
  # Short confirmation beep; skipped while the buzzer switch is on (alarm).
  - id: print_beep
    mode: single
    then:
      - if:
          condition:
            switch.is_off: buzzer_switch
          then:
            - output.ledc.set_frequency:
                id: buzzer_output
                frequency: "2441Hz"
            - output.set_level:
                id: buzzer_output
                level: "75%"
            - delay: 100ms
            - output.turn_off: buzzer_output
  - id: print_error_beep
    mode: single
    then:
      - script.execute: print_beep
      - script.wait: print_beep
      - delay: 150ms
      - script.execute: print_beep
  # Air filter (a separate ESPHome node, set directly over its REST API by air_filter.h, no Home Assistant):
  # fan speed 0-6 from PM2.5 (PMS) and TVOC (ENS160), the higher of the two; see the "Filter Speed ..." numbers.
  # Runs every 30 s; while "Filter Auto" is on it sends when the speed changes and every 2 min, so the filter
  # gets its speed back after a restart. Nothing is sent while both values are off or have no reading (the
  # ENS160 warms up after a reboot).
  - id: filter_control
    mode: single
    then:
      - lambda: |-
          id(filter_speed_pm) = airfilter::speed_for(id(filter_speed_pm), id(pm25_pms).state,
                                                     id(filter_pm_start).state, id(filter_pm_full).state);
          id(filter_speed_tvoc) = airfilter::speed_for(id(filter_speed_tvoc), id(tvoc_ens160).state,
                                                       id(filter_tvoc_start).state, id(filter_tvoc_full).state);
          int speed = id(filter_speed_pm) > id(filter_speed_tvoc) ? id(filter_speed_pm) : id(filter_speed_tvoc);
          if (speed < 0) return;
          if (id(filter_target_speed).state != speed) id(filter_target_speed).publish_state(speed);
          if (!id(filter_auto).state) return;
          uint32_t now = millis();
          if (speed == id(filter_sent_speed) && now - id(filter_last_send) < 120000) return;
          const char *reason = id(filter_speed_tvoc) > id(filter_speed_pm) ? "TVOC" : "PM2.5";
          if (!airfilter::start(id(filter_host).state, "${filter_fan_path}", speed, reason, "${filter_user}",
                                "${filter_password}")) {
            id(filter_seen_state) = -1;
            return;
          }
          id(filter_sent_speed) = speed;
          id(filter_last_send) = now;
          id(filter_seen_state) = -1;
  # Calibration: sets the offset of each temperature (humidity = false) or humidity sensor so that it reads the
  # "Reference ..." value: offset = reference - last raw reading (before the offset filter), so pressing twice
  # gives the same result. Rounded to the 0.1 step and kept within the offset's range ("(limit)" in the status).
  # Takes effect with each sensor's next reading (BME680 every 5 min).
  - id: calibrate_offsets
    mode: single
    parameters:
      humidity: bool
    then:
      - lambda: |-
          struct Item {
            const char *name;
            sensor::Sensor *value;
            number::Number *offset;
          };
          const Item temperatures[] = {
              {"SHT41", id(temp_sht41), id(temp_sht41_offset)},
              {"SCD40", id(temp_scd40), id(temp_scd40_offset)},
              {"AHT21", id(temp_aht21_ens), id(temp_aht21_ens_offset)},
              {"BME680", id(temp_bme680), id(temp_bme680_offset)},
          };
          const Item humidities[] = {
              {"SHT41", id(hum_sht41), id(hum_sht41_offset)},
              {"SCD40", id(hum_scd40), id(hum_scd40_offset)},
              {"AHT21", id(hum_aht21_ens), id(hum_aht21_ens_offset)},
              {"BME680", id(hum_bme680), id(hum_bme680_offset)},
          };
          const Item *items = humidity ? humidities : temperatures;
          float reference = humidity ? id(ref_humidity).state : id(ref_temperature).state;
          std::string status = humidity ? "Humidity:" : "Temperature:";
          char buf[48];
          for (int i = 0; i < 4; i++) {
            const Item &item = items[i];
            float raw = item.value->get_raw_state();
            if (isnan(raw) || isnan(reference)) {
              snprintf(buf, sizeof(buf), " %s no reading;", item.name);
              status += buf;
              continue;
            }
            float old_offset = item.offset->state;
            float offset = roundf((reference - raw) * 10.0f) / 10.0f;
            float min_offset = item.offset->traits.get_min_value();
            float max_offset = item.offset->traits.get_max_value();
            bool limited = offset < min_offset || offset > max_offset;
            if (offset < min_offset) offset = min_offset;
            if (offset > max_offset) offset = max_offset;
            auto call = item.offset->make_call();
            call.set_value(offset);
            call.perform();
            snprintf(buf, sizeof(buf), " %s %.1f -> %.1f%s;", item.name, old_offset, offset, limited ? " (limit)" : "");
            status += buf;
          }
          ESP_LOGI("calibration", "%s", status.c_str());
          id(calibration_status).publish_state(status);
  - id: adjust_backlight_based_on_light
    then:
      - lambda: |-
          // Single place that sets the backlight, with the levels from the web UI ("Backlight ..." numbers):
          // "Presence" during boot, while presence is detected and within 15 s of a button press or the end
          // of presence; otherwise "Dark" or "Bright" by ambient light (dark below 1 lx, bright again from
          // 2 lx: hysteresis against flicker). 0 % switches the backlight off.
          uint32_t now_s = esp_timer_get_time() / 1000000ULL;
          bool someone = now_s < 30 || id(presencesensor).state ||
                         now_s - id(last_button_press_timestamp) < 15 ||
                         now_s - id(last_presence_release_timestamp) < 15;
          float level;
          if (someone) {
            level = id(backlight_presence_level).state;
          } else {
            auto *light_sensor = id(ambient_light_ltr390);
            float lux = light_sensor->state;
            if (!light_sensor->has_state() || isnan(lux)) return;
            id(backlight_dark) = id(backlight_dark) ? lux < 2 : lux < 1;
            level = id(backlight_dark) ? id(backlight_dark_level).state : id(backlight_bright_level).state;
          }
          if (isnan(level)) return;
          // Only act on a change: the LTR390 publishes every few seconds.
          auto &target = id(back_light).remote_values;
          float current = target.is_on() ? target.get_brightness() * 100.0f : 0.0f;
          if (fabsf(current - level) < 0.5f) return;
          // turn_on with brightness 0 would leave the light "on" at 0 %, so 0 % is an explicit turn_off.
          auto call = level > 0.0f ? id(back_light).turn_on() : id(back_light).turn_off();
          if (level > 0.0f) call.set_brightness(level / 100.0f);
          call.perform();

