# I2C Bus 1:
# SDA Pin: GPIO11
# SCL Pin: GPIO12
# i2c device at address 0x44 SHT41
# i2c device at address 0x53 LTR390
# i2c device at address 0x58 SGP30
# i2c device at address 0x62 SCD40
# i2c device at address 0x77 BME680

# I2C Bus 2:
# SDA Pin: GPIO17
# SCL Pin: GPIO18
# i2c device at address 0x38 ATH21
# i2c device at address 0x53 ENS160