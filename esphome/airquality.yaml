         graph_y_current += graph_height + graph_padding;
         it.printf(label_col_x, graph_y_current, fl14, id(grey), TextAlign::TOP_RIGHT, "lx  %.0f", 2000.0);
         it.printf(label_col_x, graph_y_current + graph_height / 2, fl14, id(white), TextAlign::CENTER_RIGHT, "Light");
         it.printf(label_col_x, graph_y_current + graph_height - 1, fl14, id(grey), TextAlign::BOTTOM_RIGHT, "%.0f", 0.0);
         it.graph(graph_col_x, graph_y_current, id(light_graph_24h));
         graph_y_current += graph_height + graph_padding;
      } else if (current_main_display_mode == 7) {
         auto current_ip = wifi::global_wifi_component->wifi_sta_ip_addresses()[0];
         char ip_buf[40];
         current_ip.str_to(ip_buf);
         char url_str[48];
         sprintf(url_str, "http://%s", ip_buf);
         id(webserver_qr).set_value(url_str);
         auto qr_matrix_size = id(webserver_qr).get_size();
         int max_scale_w = w / qr_matrix_size;
         int max_scale_h = (footer_start_y - (fl14->get_height() + 10)) / qr_matrix_size;
         int scale = std::min(max_scale_w, max_scale_h);
         if (scale <= 0) scale = 1;
         auto drawn_qr_size = qr_matrix_size * scale;
         int qr_x = (w - drawn_qr_size) / 2;
         int qr_y = (footer_start_y - (fl14->get_height() + 10) - drawn_qr_size) / 2 + 10;
         id(webserver_qr).draw(&it, qr_x, qr_y, Color::WHITE, scale);
         it.print(w/2, footer_start_y - 10, fl14, id(grey), TextAlign::BOTTOM_CENTER, "Scan for Webserver");
      }
      int text_baseline_y = h - bottom_margin_val - 4;
      it.filled_rectangle(0, footer_start_y, w, bottom_bar_height, Color::BLACK);
      int displayed_page_number;
      if (current_main_display_mode == 0) displayed_page_number = 1;
      else if (current_main_display_mode == 3) displayed_page_number = 2;
      else if (current_main_display_mode == 6) displayed_page_number = 3;
      else if (current_main_display_mode == 1) displayed_page_number = 4;
      else if (current_main_display_mode == 2) displayed_page_number = 5;
      else if (current_main_display_mode == 4) displayed_page_number = 6;
      else if (current_main_display_mode == 5) displayed_page_number = 7;
      else if (current_main_display_mode == 7) displayed_page_number = 8;
      else displayed_page_number = 0;
      int total_pages = 8;
      if (current_main_display_mode == 0) {
        uint32_t current_time_ms = (uint32_t) (esp_timer_get_time() / 1000);
        if (current_time_ms - id(last_bottom_toggle_time) >= 10000) {
          id(display_mode_toggle) = 1 - id(display_mode_toggle);
          id(last_bottom_toggle_time) = current_time_ms;
        }
        int current_display_mode_bottom = id(display_mode_toggle);
        if (current_display_mode_bottom == 0) {
          auto now = id(esptime).now();
          if (now.is_valid()) {
            it.strftime(10, text_baseline_y, fl14, id(white), TextAlign::BOTTOM_LEFT, "%d.%m.%Y", now);
            it.strftime(w - 10, text_baseline_y, fl14, id(white), TextAlign::BOTTOM_RIGHT, "%H:%M", now);
          }
        } else {
          auto current_ip = wifi::global_wifi_component->wifi_sta_ip_addresses()[0];
          char ip_str[40];
          current_ip.str_to(ip_str);
          it.print(10, text_baseline_y, fl14, id(grey), TextAlign::BOTTOM_LEFT, App.get_name().c_str());
          it.print(w - 10, text_baseline_y, fl14, id(white), TextAlign::BOTTOM_RIGHT, ip_str);
        }
      } else if (current_main_display_mode == 1) {
          it.print(10, text_baseline_y, fl14, id(white), TextAlign::BOTTOM_LEFT, "VCPM");
          it.printf(w - 10, text_baseline_y, fl14, id(white), TextAlign::BOTTOM_RIGHT, "Graphen 1h");
      } else if (current_main_display_mode == 2) {
          it.print(10, text_baseline_y, fl14, id(white), TextAlign::BOTTOM_LEFT, "THPDL");
          it.printf(w - 10, text_baseline_y, fl14, id(white), TextAlign::BOTTOM_RIGHT, "Graphen 1h");
      } else if (current_main_display_mode == 3) {
          it.print(10, text_baseline_y, fl14, id(white), TextAlign::BOTTOM_LEFT, "Info Page");
          float altitude = id(calculated_altitude).state;
          if (isnan(altitude)) {
              it.print(w - 10, text_baseline_y, fl14, id(grey), TextAlign::BOTTOM_RIGHT, "-- m");
          } else {
              it.printf(w - 10, text_baseline_y, fl14, id(white), TextAlign::BOTTOM_RIGHT, "%.0f m", altitude);
          }
      } else if (current_main_display_mode == 6) {
          it.print(10, text_baseline_y, fl14, id(white), TextAlign::BOTTOM_LEFT, "Ram CPU");
          it.print(w - 10, text_baseline_y, fl14, id(white), TextAlign::BOTTOM_RIGHT, "Graphen 1h");
      } else if (current_main_display_mode == 4) {
          it.print(10, text_baseline_y, fl14, id(white), TextAlign::BOTTOM_LEFT, "VCPM");
          it.printf(w - 10, text_baseline_y, fl14, id(white), TextAlign::BOTTOM_RIGHT, "Graphen 24h");
      } else if (current_main_display_mode == 5) {
          it.print(10, text_baseline_y, fl14, id(white), TextAlign::BOTTOM_LEFT, "THPDL");
          it.printf(w - 10, text_baseline_y, fl14, id(white), TextAlign::BOTTOM_RIGHT, "Graphen 24h");
      } else if (current_main_display_mode == 7) {
          it.print(10, text_baseline_y, fl14, id(white), TextAlign::BOTTOM_LEFT, "QR Code");
      }
      char page_indicator_str[6];
      sprintf(page_indicator_str, "%d/%d", displayed_page_number, total_pages);
      it.print(w / 2, text_baseline_y, fl14, id(light_grey), TextAlign::BOTTOM_CENTER, page_indicator_str);
      };
      draw_screen(it);
      if (id(print_requested)) {
        id(print_requested) = false;
        auto &canvas = thermalprint::canvas();
        canvas.clear_bits();
        canvas.set_ink_threshold(id(print_ink_threshold).state);
        draw_screen(canvas);
        auto now = id(esptime).now();
        thermalprint::Options opt;  // "Print ..." entities in the web UI, section "Printer"
        opt.large = id(print_size).active_index().value_or(1) == 1;
        opt.header = id(print_header).state;
        opt.feed_lines = id(print_feed_lines).state;
        thermalprint::start(id(printer_host).state, ${printer_port}, App.get_friendly_name().c_str(),
                            now.is_valid() ? now.strftime("%d.%m.%Y  %H:%M") : std::string(), opt);
        id(print_seen_state) = -1;
      }
      // Print result box, drawn after the printer copy so it only shows on the screen.
      if (id(print_toast) != 0) {
        bool sent = id(print_toast) == 1;
        auto color = sent ? id(green) : id(red);
        int bw = 190, bh = 50;
        int bx = (it.get_width() - bw) / 2, by = (it.get_height() - bh) / 2;
        it.filled_rectangle(bx, by, bw, bh, Color::BLACK);
        it.rectangle(bx, by, bw, bh, color);
        it.rectangle(bx + 1, by + 1, bw - 2, bh - 2, color);
        it.print(bx + bw / 2, by + bh / 2, id(font_value_30), color, TextAlign::CENTER,
                 sent ? "Copy sent" : "Send failed");
      }
    dimensions:
      height: 320
      width: 240

# interfaces
uart:
  - tx_pin: GPIO10
    rx_pin: GPIO09
    baud_rate: 9600
    id: uart_ze08
    parity: none
    data_bits: 8
    stop_bits: 1
    debug: 
      direction: BOTH
      dummy_receiver: true
      after:
        # bytes: 9 
        timeout: 10ms
      sequence:
        - lambda: |-
            //UARTDebug::log_int(direction, bytes, ',');
            //UARTDebug::log_hex(direction, bytes, ',');
            if (direction == UART_DIRECTION_RX)                      
              {
                  if (bytes.size() == 9)                               
                    {
                        if ( bytes[0] == 0xFF &&
                            bytes[1] == 0x17
                            )       
                          {
                            float value = float((bytes[4] * 256) + bytes[5]);
                            id(ch2o_ze08).publish_state(value);
                          }
                    }
              }

  - tx_pin: GPIO08
    rx_pin: GPIO07
    baud_rate: 9600
    id: uart_pms

spi:
  # Gets SPI2 (the only ESPHome SPI bus); sd_logger.h uses SPI3 for the SD card, so don't add a second bus here.
  - id: display_spi_bus
    clk_pin: GPIO01
    mosi_pin: GPIO02
    miso_pin: GPIO16

i2c:
  - sda: GPIO11
    scl: GPIO12
    scan: true
    id: i2c_1
    frequency: 100kHz

  - sda: GPIO17
    scl: GPIO18
    scan: true
    id: i2c_2
    frequency: 100kHz

# BME680 via Bosch BSEC2 (IAQ). License: private use only, don't distribute firmware binaries built with it.
bme68x_bsec2_i2c:
  - id: bme680_bsec
    i2c_id: i2c_1
    address: 0x77
    model: bme680
    supply_voltage: 3.3V
    # Gas heater + IAQ every 5 min: less self-heating of the temperature reference than LP (3 s).
    sample_rate: ULP
    operating_age: 28d
    # Calibration state to flash; 1h instead of 6h so a reboot or flash loses at most an hour of learning.
    state_save_interval: 1h

# sensors
sensor:
  # SD card free space (sd_logger.h); NaN while no card is mounted.
  - platform: template
    name: "SD Card Free"
    icon: "mdi:sd"
    entity_category: diagnostic
    web_server:
      sorting_group_id: web_group_sd_card
      sorting_weight: 2
    unit_of_measurement: "MB"
    accuracy_decimals: 0
    update_interval: 10min
    lambda: |-
      return sdlog::free_mb();

  # Template Sensors
  - platform: template
    name: "ZE08 CH2O"
    unit_of_measurement: ppb
    state_class: measurement
    device_class: volatile_organic_compounds
    id: ch2o_ze08
    icon: "mdi:gas-cylinder"
    filters: 
      - filter_out: 2000.0
      - exponential_moving_average:
          send_every: 30
          alpha: 0.5

  - platform: template
    name: "SHT41 Dewpoint"
    unit_of_measurement: "°C"
    state_class: measurement
    device_class: temperature
    id: dew_point_sensor
    icon: "mdi:water-thermometer"
    lambda: |-
      float temperature = id(temp_sht41).state;
      float humidity = id(hum_sht41).state;
      if (isnan(temperature) || isnan(humidity)) {
        return NAN;
      }
      float a = 17.27;
      float b = 237.7;
      float alpha = ((a * temperature) / (b + temperature)) + log(humidity / 100.0);
      return (b * alpha) / (a - alpha);
    update_interval: 44s

  # Reference dew point (BME680 is the temperature/humidity reference); used by the display and graphs.
  - platform: template
    name: "BME680 Dewpoint"
    unit_of_measurement: "°C"
    state_class: measurement
    device_class: temperature
    id: dew_point_bme680
    icon: "mdi:water-thermometer"
    lambda: |-
      float temperature = id(temp_bme680).state;
      float humidity = id(hum_bme680).state;
      if (isnan(temperature) || isnan(humidity)) {
        return NAN;
      }
      float a = 17.27;
      float b = 237.7;
      float alpha = ((a * temperature) / (b + temperature)) + log(humidity / 100.0);
      return (b * alpha) / (a - alpha);
    update_interval: 44s

  - platform: template
    name: "Calculated Absolute Humidity"
    id: calculated_absolute_humidity
    icon: "mdi:water-percent"
    unit_of_measurement: "g/m³"
    update_interval: 48s
    lambda: |-
      float t = NAN;
      float rh = NAN;
      if (!isnan(id(temp_bme680).state) && !isnan(id(hum_bme680).state)) {
        t = id(temp_bme680).state;
        rh = id(hum_bme680).state;
      }
      else if (!isnan(id(temp_sht41).state) && !isnan(id(hum_sht41).state)) {
        t = id(temp_sht41).state;
        rh = id(hum_sht41).state;
      }
      else {
        float temps[2] = {id(temp_scd40).state, id(temp_aht21_ens).state};
        float hums[2] = {id(hum_scd40).state, id(hum_aht21_ens).state};
        for(int i = 0; i < 2; i++) {
          if(!isnan(temps[i]) && !isnan(hums[i])) {
            t = temps[i];
            rh = hums[i];
            break;
          }
        }
      }
      if (isnan(t) || isnan(rh)) return NAN;
      float svp = 6.112 * exp((17.67 * t) / (t + 243.5));
      float avp = svp * (rh / 100.0);
      float abs_humidity = 216.7 * avp / (273.15 + t);
      return abs_humidity;

  # Select best sensor
  - platform: template
    name: "Best Temperature"
    id: best_temperature
    icon: "mdi:thermometer"
    unit_of_measurement: "°C"
    accuracy_decimals: 1
    lambda: |-
      float temps[4] = {id(temp_bme680).state, id(temp_sht41).state, id(temp_scd40).state, id(temp_aht21_ens).state};
      float selected_temp = NAN;
      for(int i = 0; i < 4; i++){
        if(!isnan(temps[i])){
          selected_temp = temps[i];
          break;
        }
      }
      return selected_temp;

  - platform: template
    name: "Calculated Altitude"
    id: calculated_altitude
    unit_of_measurement: "m"
    state_class: "measurement"
    icon: "mdi:mountain"
    update_interval: 15min
    lambda: |-
      float local_pressure = NAN;
      if (id(pres_bme680).has_state()) {
          local_pressure = id(pres_bme680).state;
      }
      float local_temperature = NAN;
      if (id(temp_bme680).has_state()) {
          local_temperature = id(temp_bme680).state;
      }
      float sea_level_pressure_ref = id(manual_sea_level_pressure).state;  // Deklaration und Initialisierung
      if (!isnan(local_pressure) && !isnan(local_temperature) && !isnan(sea_level_pressure_ref)) {
          if (local_pressure > 0 && sea_level_pressure_ref > 0) {
              float altitude = (pow(sea_level_pressure_ref / local_pressure, 1.0/5.257) - 1.0) * (local_temperature + 273.15) / 0.0065;
              return altitude;
          }
      }
      return NAN;

  - platform: template
    name: "ENS160 Warmup Max Remaining"
    id: ens160_warmup_remaining
    icon: "mdi:timer-sand"
    unit_of_measurement: "min"
    state_class: "measurement"
    accuracy_decimals: 0
    update_interval: 10s
    lambda: |-
      // Upper bound only: the ENS160 publishes as soon as its data is valid.
      if (id(eco2_ens160).has_state()) return 0;
      int64_t elapsed_min = esp_timer_get_time() / 60000000LL;
      if (elapsed_min >= 60) return 0;
      return 60 - (int) elapsed_min;
      
  # Debug Sensors
  - platform: debug
    free:
      name: "Heap Free (Bytes)"
      id: heap_free
      disabled_by_default: True
    block:
      name: "Heap Max Block (Bytes)"
      id: heap_block
      disabled_by_default: True
    psram:
      name: "PSRAM Free (Bytes)"
      id: free_psram
      disabled_by_default: True
    loop_time:
      name: "Loop Time"
      id: loop_time
      disabled_by_default: False
    cpu_frequency:
      name: "CPU Frequency"
      id: cpu_frequency
      disabled_by_default: True

  - platform: template
    name: "Heap Free (KB)"
    id: heap_free_kb
    icon: "mdi:memory"
    unit_of_measurement: "KB"
    entity_category: diagnostic
    accuracy_decimals: 0
    lambda: |-
      if (isnan(id(heap_free).state)) return NAN;
      return id(heap_free).state / 1024.0;

  - platform: template
    name: "Heap Max Block (KB)"
    id: heap_max_block_kb
    icon: "mdi:memory"
    entity_category: diagnostic
    unit_of_measurement: "KB"
    accuracy_decimals: 0
    lambda: |-
      if (isnan(id(heap_block).state)) return NAN;
      return id(heap_block).state / 1024.0;

  - platform: template
    name: "PSRAM Free (KB)"
    id: free_psram_kb
    icon: "mdi:memory"
    entity_category: diagnostic
    unit_of_measurement: "KB"
    accuracy_decimals: 0 
    lambda: |-
      if (isnan(id(free_psram).state)) return NAN;
      return id(free_psram).state / 1024.0;

  - platform: uptime
    name: "Uptime (Seconds)"
    id: uptime_sensor
    icon: "mdi:update"
    entity_category: diagnostic
    update_interval: 55s
    disabled_by_default: True

  - platform: template
    name: "Uptime (Minutes)"
    id: uptime_minutes
    icon: "mdi:update"
    entity_category: diagnostic
    unit_of_measurement: "min"
    accuracy_decimals: 0
    lambda: |-
      if (isnan(id(uptime_sensor).state)) return NAN;
      return id(uptime_sensor).state / 60.0;

  - platform: wifi_signal
    name: "WiFi Strength"
    entity_category: diagnostic
    icon: "mdi:wifi"
    update_interval: 60s

  - platform: template
    name: "CPU Frequency MHz"
    icon: "mdi:cpu-32-bit"
    entity_category: diagnostic
    unit_of_measurement: "MHz"
    lambda: |-
      if (id(cpu_frequency).has_state()) {
        float freq = id(cpu_frequency).state;
        if (freq > 0) {
          return {static_cast<float>(round(freq / 1000000 * 100) / 100)};
        } else {
          return {NAN};
        }
      } else {
        return {NAN};
      }
    update_interval: 66s

  # I2C 1 Bus
  - platform: sht4x
    address: 0x44
    i2c_id: i2c_1
    temperature:
      name: "SHT41 Temperature"
      id: temp_sht41
      icon: "mdi:thermometer"
      filters:
        - offset: !lambda return id(temp_sht41_offset).state;
    humidity:
      name: "SHT41 Relative Humidity"
      id: hum_sht41
      icon: "mdi:water-percent"
      filters:
        - offset: !lambda return id(hum_sht41_offset).state;
    precision: High
    update_interval: 79s

  - platform: scd4x
    address: 0x62
    i2c_id: i2c_1
    co2:
      name: "SCD40 CO2"
      id: co2_scd40
      icon: "mdi:molecule-co2"
    temperature:
      name: "SCD40 Temperature"
      id: temp_scd40
      icon: "mdi:thermometer"
      filters:
        - offset: !lambda return id(temp_scd40_offset).state;
    humidity:
      name: "SCD40 Humidity"
      id: hum_scd40
      icon: "mdi:water-percent"
      filters:
        - offset: !lambda return id(hum_scd40_offset).state;
    # ESPHome's default is 4 °C; the chip applies it before this config's own "SCD40 Temperature Offset"
    # filter, so the two never stack. Explicit so a default change upstream can't silently shift readings.
    temperature_offset: 4
    automatic_self_calibration: true
    ambient_pressure_compensation_source: pres_bme680
    update_interval: 33s

  - platform: sgp30
    i2c_id: i2c_1
    address: 0x58
    eco2:
      name: "SGP30 eCO2"
      id: eco2_sgp30
      icon: "mdi:molecule-co2"
      accuracy_decimals: 0
      filters: 
        - exponential_moving_average: 
            send_every: 1
            alpha: 0.2
    tvoc:
      name: "SGP30 TVOC"
      id: tvoc_sgp30
      accuracy_decimals: 1
      filters: 
        - exponential_moving_average: 
            send_every: 1
            alpha: 0.2
    store_baseline: yes
    update_interval: 36s
    # SHT41: the most accurate temperature/humidity sensor in the box.
    compensation:
      humidity_source: hum_sht41
      temperature_source: temp_sht41

  # Not populated in this box: there is no SGP41 at 0x59, so setup logs "Get serial number failed" and the
  # component is marked FAILED on every boot; both entities stay unavailable. The block is kept for a later
  # upgrade — comment it out if the chip won't be fitted.
  - platform: sgp4x
    i2c_id: i2c_1
    #address: 0x59
    voc_index:
      name: "SGP41 VOC Index"
      id: aqi_voc_sgp41
      disabled_by_default: True
      icon: "mdi:radiator"
      device_class: aqi
      state_class: measurement
      unit_of_measurement: "index points"
    nox_index:
      name: "SGP41 NOx Index"
      id: aqi_nox_sgp41
      disabled_by_default: True
      icon: "mdi:radiator"
      device_class: aqi
      state_class: measurement
      unit_of_measurement: "index points"
    # SHT41: the most accurate temperature/humidity sensor in the box.
    compensation:
      humidity_source: hum_sht41
      temperature_source: temp_sht41
    store_baseline: True
    update_interval: 41s

  - platform: ltr390
    id: uv_light_ltr390
    address: 0x53
    i2c_id: i2c_1
    uv_index:
      name: "LTR390 UV Index"
      id: uv_index_ltr390
      icon: "mdi:sun-wireless-outline"
    light:
      name: "LTR390 Ambient Light"
      icon: "mdi:weather-sunny"
      id: ambient_light_ltr390
      on_value:
        then:
          - script.execute: adjust_backlight_based_on_light
    gain: X3
    resolution: 18   
    update_interval: 11s

  # All outputs follow the hub's ULP rate (every 5 min). Per-sensor LP with a ULP hub fails at setup:
  # BSEC2 status 14 = BSEC_W_SU_SAMPLERATEMISMATCH.
  - platform: bme68x_bsec2
    bme68x_bsec2_id: bme680_bsec
    temperature:
      name: "BME680 Temperature"
      id: temp_bme680
      icon: "mdi:thermometer"
      filters:
        - offset: !lambda return id(temp_bme680_offset).state;
    pressure:
      name: "BME680 Pressure"
      id: pres_bme680
      icon: "mdi:mountain"
    humidity:
      name: "BME680 Humidity"
      id: hum_bme680
      icon: "mdi:water-percent"
      filters:
        - offset: !lambda return id(hum_bme680_offset).state;
    gas_resistance:
      name: "BME680 Gas Resistance"
      id: gas_resistance_bme680
      icon: "mdi:omega"
    iaq:
      name: "BME680 Indoor Air Quality"
      id: iaq_bme680
      icon: "mdi:gauge"
    iaq_static:
      name: "BME680 Static IAQ"
      id: iaq_static_bme680
      icon: "mdi:gauge"
    co2_equivalent:
      name: "BME680 CO2 Equivalent"
      id: co2eq_bme680
      icon: "mdi:molecule-co2"
    breath_voc_equivalent:
      name: "BME680 Breath VOC Equivalent"
      id: bvoc_bme680
      icon: "mdi:air-filter"

  # I2C 2 Bus
  - platform: aht10
    address: 0x38
    i2c_id: i2c_2
    variant: AHT20
    temperature:
      name: "AHT21 ENS160 Temperature"
      id: temp_aht21_ens
      icon: "mdi:thermometer"
      disabled_by_default: false
      filters:
        - offset: !lambda return id(temp_aht21_ens_offset).state;
    humidity:
      name: "AHT21 ENS160 Humidity"
      id: hum_aht21_ens
      icon: "mdi:water-percent"
      disabled_by_default: false
      filters:
        - offset: !lambda return id(hum_aht21_ens_offset).state;
    update_interval: 73s

  - platform: ens160_i2c
    id: ens160_chip
    address: 0x53
    i2c_id: i2c_2
    eco2:
      name: "ENS160 eCO2"
      id: eco2_ens160
      icon: "mdi:molecule-co2"
    tvoc:
      name: "ENS160 TVOC"
      id: tvoc_ens160
      filters: 
        - exponential_moving_average: 
            send_every: 1
            alpha: 0.5
    aqi:
      name: "ENS160 Air Quality Index"
      id: aqi_ens160
    update_interval: 17s
    # SHT41: the most accurate temperature/humidity sensor in the box (the AHT21 next to the ENS160 reads its heat).
    compensation:
      temperature: temp_sht41
      humidity: hum_sht41

  # Serial Bus
  - platform: pmsx003
    type: PMSX003
    # Above 30 s the sensor sleeps between readings and wakes 30 s early: 30 s on, 90 s off.
    update_interval: 120s
    uart_id: uart_pms
    pm_1_0:
      name: "PMS Particulate Matter <1.0µm Concentration"
      id: pm1_pms
    pm_2_5:
      name: "PMS Particulate Matter <2.5µm Concentration"
      id: pm25_pms
    pm_10_0:
      name: "PMS Particulate Matter <10.0µm Concentration"
      id: pm10_pms

  # Fan speed 0-6 that "Filter Auto" sends to the air filter; empty until the first PM2.5 reading.
  - platform: template
    name: "Filter Target Speed"
    id: filter_target_speed
    icon: "mdi:fan"
    entity_category: diagnostic
    accuracy_decimals: 0
    web_server:
      sorting_group_id: web_group_filter
      sorting_weight: 2

# Buzzer with Auto Alert
switch:
  # Screen print (thermal_print.h): box name and date above the image.
  - platform: template
    name: "Print Header"
    id: print_header
    icon: "mdi:format-header-1"
    entity_category: config
    web_server:
      sorting_group_id: web_group_printer
      sorting_weight: 5
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
  # Air filter control: sets the filter's fan speed from PM2.5 (script filter_control). When off, the fan
  # keeps its current speed, so the filter can be set by hand.
  - platform: template
    name: "Filter Auto"
    id: filter_auto
    icon: "mdi:fan-auto"
    web_server:
      sorting_group_id: web_group_filter
      sorting_weight: 1
    optimistic: true
    # Off on first start, so it doesn't fight another controller still running on the filter.
    restore_mode: RESTORE_DEFAULT_OFF
    # Send right away, even if the speed hasn't changed.
    on_turn_on:
      - lambda: id(filter_sent_speed) = -1;
      - script.execute: filter_control
  - platform: template
    name: "Buzzer"
    id: buzzer_switch
    icon: "mdi:alarm-light-outline"
    optimistic: true
    turn_on_action:
      - output.turn_on: buzzer_output
      - output.ledc.set_frequency:
          id: buzzer_output
          frequency: "2441Hz"
      - output.set_level:
          id: buzzer_output
          level: "75%"
    turn_off_action:
      - output.turn_off: buzzer_output

  - platform: template
    name: "Buzzer Alarm Aktiv"
    id: buzzer_alarm_enable_switch
    entity_category: config
    icon: "mdi:alarm-light"
    optimistic: true
    lambda: |-
      return id(buzzer_alarm_enabled);
    turn_on_action:
      - lambda: |-
          id(buzzer_alarm_enabled) = true;
          ESP_LOGD("Buzzer", "Buzzer Alarm enabled");
    turn_off_action:
      - lambda: |-
          id(buzzer_alarm_enabled) = false;
          ESP_LOGD("Buzzer", "Buzzer Alarm disabled");

  - platform: restart
    name: ${name} restart
    entity_category: diagnostic

# Buttons
button:
  # Factory Reset
  - platform: factory_reset
    name: "Factory Reset"
    entity_category: diagnostic
  # Save Mode
  - platform: safe_mode
    name: "Safe Mode"
    entity_category: diagnostic
  # SD card (sd_logger.h): unmount before pulling the card (wait for "Not mounted (safe to remove)"; the
  # sdlog task handles the request after a row in progress), mount after inserting it.
  - platform: template
    name: "SD Card Mount"
    icon: "mdi:sd"
    entity_category: config
    web_server:
      sorting_group_id: web_group_sd_card
      sorting_weight: 3
    on_press:
      - lambda: sdlog::request_mount();
  - platform: template
    name: "SD Card Unmount"
    icon: "mdi:eject"
    entity_category: config
    web_server:
      sorting_group_id: web_group_sd_card
      sorting_weight: 4
    on_press:
      - lambda: sdlog::request_unmount();
  # Calibration: set every temperature or humidity offset from the "Reference ..." value (script calibrate_offsets).
  - platform: template
    name: "Calibrate Temperature"
    icon: "mdi:thermometer-check"
    entity_category: config
    web_server:
      sorting_group_id: web_group_calibration
      sorting_weight: 3
    on_press:
      - script.execute:
          id: calibrate_offsets
          humidity: false
  - platform: template
    name: "Calibrate Humidity"
    icon: "mdi:water-check"
    entity_category: config
    web_server:
      sorting_group_id: web_group_calibration
      sorting_weight: 4
    on_press:
      - script.execute:
          id: calibrate_offsets
          humidity: true
  # Same as holding the top button for 5 s.
  - platform: template
    name: "Print Screen"
    icon: "mdi:printer-pos"
    web_server:
      sorting_group_id: web_group_printer
      sorting_weight: 3
    on_press:
      - script.execute: print_screen

# Intervals
interval:
  # Screen print status: publish on change; when a print finished, show the result on the screen for 3 s
  # (two beeps when it failed).
  - interval: 500ms
    then:
      - lambda: |-
          int state = thermalprint::state;
          if (state == id(print_seen_state)) return;
          id(print_seen_state) = state;
          id(printer_status).publish_state(thermalprint::status_text());
          if (state != thermalprint::DONE && state != thermalprint::FAILED) return;
          if (state == thermalprint::FAILED) id(print_error_beep).execute();
          id(print_toast) = state == thermalprint::DONE ? 1 : 2;
          id(display_main).update();
          App.scheduler.set_timeout(id(display_main), "print_toast", 3000, []() {
            id(print_toast) = 0;
            id(display_main).update();
          });
  # Air filter: fan speed from PM2.5 and TVOC.
  - interval: 30s
    then:
      - script.execute: filter_control
  # Air filter request status: publish on change.
  - interval: 1s
    then:
      - lambda: |-
          int state = airfilter::state;
          if (state == id(filter_seen_state)) return;
          id(filter_seen_state) = state;
          id(filter_status).publish_state(airfilter::status_text());
  # SD card log: one CSV row per minute into /sdcard/YYYYMMDD.CSV.
  - interval: 60s
    then:
      - lambda: |-
          if (!sdlog::is_mounted()) return;
          auto now = id(esptime).now();
          if (!now.is_valid()) return;
          static const char *const header =
              "time,bme680_t,bme680_rh,bme680_p,bme680_gas,bme680_iaq,bme680_iaq_acc,bme680_iaq_static,"
              "bme680_co2eq,bme680_bvoc,scd40_co2,scd40_t,scd40_rh,sgp30_eco2,sgp30_tvoc,"
              "ens160_eco2,ens160_tvoc,ens160_aqi,ze08_ch2o,pm1,pm25,pm10,lux,uvi,"
              "sht41_t,sht41_rh,aht21_t,aht21_rh,dew_bme680,dew_sht41,abs_hum";
          char date[16];
          now.strftime(date, sizeof(date), "%Y%m%d");
          sdlog::Row row;
          now.strftime(row.buf, sizeof(row.buf), "%Y-%m-%d %H:%M:%S");
          row.len = strlen(row.buf);
          row.num(id(temp_bme680).state, 2);
          row.num(id(hum_bme680).state, 2);
          row.num(id(pres_bme680).state, 1);
          row.num(id(gas_resistance_bme680).state, 0);
          row.num(id(iaq_bme680).state, 0);
          row.text(id(iaq_accuracy_bme680).state);
          row.num(id(iaq_static_bme680).state, 0);
          row.num(id(co2eq_bme680).state, 0);
          row.num(id(bvoc_bme680).state, 2);
          row.num(id(co2_scd40).state, 0);
          row.num(id(temp_scd40).state, 2);
          row.num(id(hum_scd40).state, 2);
          row.num(id(eco2_sgp30).state, 0);
          row.num(id(tvoc_sgp30).state, 0);
          row.num(id(eco2_ens160).state, 0);
          row.num(id(tvoc_ens160).state, 0);
          row.num(id(aqi_ens160).state, 0);
          row.num(id(ch2o_ze08).state, 1);
          row.num(id(pm1_pms).state, 0);
          row.num(id(pm25_pms).state, 0);
          row.num(id(pm10_pms).state, 0);
          row.num(id(ambient_light_ltr390).state, 1);
          row.num(id(uv_index_ltr390).state, 2);
          row.num(id(temp_sht41).state, 2);
          row.num(id(hum_sht41).state, 2);
          row.num(id(temp_aht21_ens).state, 2);
          row.num(id(hum_aht21_ens).state, 2);
          row.num(id(dew_point_bme680).state, 2);
          row.num(id(dew_point_sensor).state, 2);
          row.num(id(calculated_absolute_humidity).state, 2);
          sdlog::log_row(date, header, row);

  # SD card: retry mounting every 10 min while no card is mounted (card inserted later, or pulled
  # without unmounting). Runs in the sdlog task, so a slow or stuck card doesn't block the loop.
  - interval: 10min
    then:
      - lambda: |-
          if (!sdlog::is_mounted()) sdlog::request_mount();

  - interval: 10s
    then:
      - if:
          condition:
            lambda: |-
              return (id(buzzer_alarm_enabled) &&
                      (
                        (id(co2_scd40).state > id(co2_alarm_threshold).state) ||
                        (id(ch2o_ze08).state > id(ch2o_alarm_threshold).state) ||
                        (id(tvoc_ens160).state > id(tvoc_alarm_threshold_ens).state) ||
                        (id(tvoc_sgp30).state > id(tvoc_alarm_threshold_sgp30).state) ||
                        (id(pm1_pms).state > id(pm1_alarm_threshold).state) ||
                        (id(pm25_pms).state > id(pm25_alarm_threshold).state) ||
                        (id(pm10_pms).state > id(pm10_alarm_threshold).state)
                      ));
          then:
            - switch.turn_on: buzzer_switch
            - delay: 1s
            - switch.turn_off: buzzer_switch

  - interval: 10s
    then:
      - lambda: |-
          uint32_t last_press_time = id(last_button_press_timestamp);
          uint32_t current_time = esp_timer_get_time() / 1000000ULL;
          uint32_t time_since_last_button_press = current_time - last_press_time;
          int current_mode = id(main_display_mode);
          if (time_since_last_button_press >= 30 && current_mode != 0) {
            id(main_display_mode) = 0;
            id(display_main).update();
          }

# Timestamp-Service
time:
  - platform: sntp
    id: esptime
    timezone: "Europe/Berlin"
    servers: "pool.ntp.org"

# Scripts
script:
  # Screen print (thermal_print.h): the next display update draws the page into the printer canvas too.
  - id: print_screen
    mode: single
    then:
      - if:
          condition:
            lambda: return thermalprint::busy();
          then:
            - logger.log:
                level: WARN
                format: "Screen print ignored: previous print still sending"
            - script.execute: print_error_beep
          else:
            - lambda: |-
                id(print_requested) = true;
                App.scheduler.set_timeout(id(display_main), "print_screen", 0, []() { id(display_main).update(); });
            - script.execute: print_beep
  # Short confirmation beep; skipped while the buzzer switch is on (alarm).
  - id: print_beep
    mode: single
    then:
      - if:
          condition:
            switch.is_off: buzzer_switch
          then:
            - output.ledc.set_frequency:
                id: buzzer_output
                frequency: "2441Hz"
            - output.set_level:
                id: buzzer_output
                level: "75%"
            - delay: 100ms
            - output.turn_off: buzzer_output
  - id: print_error_beep
    mode: single
    then:
      - script.execute: print_beep
      - script.wait: print_beep
      - delay: 150ms
      - script.execute: print_beep
  # Air filter (a separate ESPHome node, set directly over its REST API by air_filter.h, no Home Assistant):
  # fan speed 0-6 from PM2.5 (PMS) and TVOC (ENS160), the higher of the two; see the "Filter Speed ..." numbers.
  # Runs every 30 s; while "Filter Auto" is on it sends when the speed changes and every 2 min, so the filter
  # gets its speed back after a restart. Nothing is sent while both values are off or have no reading (the
  # ENS160 warms up after each boot).
  - id: filter_control
    mode: single
    then:
      - lambda: |-
          id(filter_speed_pm) = airfilter::speed_for(id(filter_speed_pm), id(pm25_pms).state,
                                                     id(filter_pm_start).state, id(filter_pm_full).state);
          id(filter_speed_tvoc) = airfilter::speed_for(id(filter_speed_tvoc), id(tvoc_ens160).state,
                                                       id(filter_tvoc_start).state, id(filter_tvoc_full).state);
          int speed = std::max(id(filter_speed_pm), id(filter_speed_tvoc));
          if (speed < 0) return;
          if (id(filter_target_speed).state != speed) id(filter_target_speed).publish_state(speed);
          if (!id(filter_auto).state) return;
          uint32_t now = millis();
          if (speed == id(filter_sent_speed) && now - id(filter_last_send) < 120000) return;
          const char *reason = id(filter_speed_tvoc) > id(filter_speed_pm) ? "TVOC" : "PM2.5";
          if (!airfilter::start(id(filter_host).state, "${filter_fan_path}", speed, reason, "${filter_user}",
                                "${filter_password}")) {
            id(filter_seen_state) = -1;
            return;
          }
          id(filter_sent_speed) = speed;
          id(filter_last_send) = now;
          id(filter_seen_state) = -1;
  # Calibration: sets the offset of each temperature (humidity = false) or humidity sensor so that it reads the
  # "Reference ..." value: offset = reference - last raw reading (before the offset filter), so pressing twice
  # gives the same result. Rounded to the 0.1 step and kept within the offset's range ("(limit)" in the status).
  # Takes effect with each sensor's next reading (BME680 every 5 min).
  - id: calibrate_offsets
    mode: single
    parameters:
      humidity: bool
    then:
      - lambda: |-
          struct Item {
            const char *name;
            sensor::Sensor *value;
            number::Number *offset;
          };
          const Item temperatures[] = {
              {"SHT41", id(temp_sht41), id(temp_sht41_offset)},
              {"SCD40", id(temp_scd40), id(temp_scd40_offset)},
              {"AHT21", id(temp_aht21_ens), id(temp_aht21_ens_offset)},
              {"BME680", id(temp_bme680), id(temp_bme680_offset)},
          };
          const Item humidities[] = {
              {"SHT41", id(hum_sht41), id(hum_sht41_offset)},
              {"SCD40", id(hum_scd40), id(hum_scd40_offset)},
              {"AHT21", id(hum_aht21_ens), id(hum_aht21_ens_offset)},
              {"BME680", id(hum_bme680), id(hum_bme680_offset)},
          };
          const Item *items = humidity ? humidities : temperatures;
          float reference = humidity ? id(ref_humidity).state : id(ref_temperature).state;
          std::string status = humidity ? "Humidity:" : "Temperature:";
          char buf[48];
          for (int i = 0; i < 4; i++) {
            const Item &item = items[i];
            float raw = item.value->get_raw_state();
            if (isnan(raw) || isnan(reference)) {
              snprintf(buf, sizeof(buf), " %s no reading;", item.name);
              status += buf;
              continue;
            }
            float old_offset = item.offset->state;
            float offset = roundf((reference - raw) * 10.0f) / 10.0f;
            float min_offset = item.offset->traits.get_min_value();
            float max_offset = item.offset->traits.get_max_value();
            bool limited = offset < min_offset || offset > max_offset;
            offset = std::max(min_offset, std::min(max_offset, offset));
            auto call = item.offset->make_call();
            call.set_value(offset);
            call.perform();
            snprintf(buf, sizeof(buf), " %s %.1f -> %.1f%s;", item.name, old_offset, offset, limited ? " (limit)" : "");
            status += buf;
          }
          ESP_LOGI("calibration", "%s", status.c_str());
          id(calibration_status).publish_state(status);
  - id: adjust_backlight_based_on_light
    then:
      - lambda: |-
          // Single place that sets the backlight, with the levels from the web UI ("Backlight ..." numbers):
          // "Presence" during boot, while presence is detected and within 15 s of a button press or the end
          // of presence; otherwise "Dark" or "Bright" by ambient light (dark below 1 lx, bright again from
          // 2 lx: hysteresis against flicker). 0 % switches the backlight off.
          uint32_t now_s = esp_timer_get_time() / 1000000ULL;
          bool someone = now_s < 30 || id(presencesensor).state ||
                         now_s - id(last_button_press_timestamp) < 15 ||
                         now_s - id(last_presence_release_timestamp) < 15;
          float level;
          if (someone) {
            level = id(backlight_presence_level).state;
          } else {
            auto *light_sensor = id(ambient_light_ltr390);
            float lux = light_sensor->state;
            if (!light_sensor->has_state() || isnan(lux)) return;
            id(backlight_dark) = id(backlight_dark) ? lux < 2 : lux < 1;
            level = id(backlight_dark) ? id(backlight_dark_level).state : id(backlight_bright_level).state;
          }
          if (isnan(level)) return;
          // Only act on a change: the LTR390 publishes every few seconds.
          auto &target = id(back_light).remote_values;
          float current = target.is_on() ? target.get_brightness() * 100.0f : 0.0f;
          if (fabsf(current - level) < 0.5f) return;
          // turn_on with brightness 0 would leave the light "on" at 0 %, so 0 % is an explicit turn_off.
          auto call = level > 0.0f ? id(back_light).turn_on() : id(back_light).turn_off();
          if (level > 0.0f) call.set_brightness(level / 100.0f);
          call.perform();

# | ------------------------------------------- |
# | GPIO Pin | Notes.                           |
# | :------- | :------------------------------- |
# | GPIO00   | Free (Boot Button).              |
# | GPIO01   | SPI CLK Pin                      |
# | GPIO02   | SPI MOSI Pin                     |
# | GPIO03   | Display CS Pin                   |
# | GPIO04   | Display DC Pin                   |
# | GPIO05   | Free (JTAG).                     |
# | GPIO06   | Display Reset Pin                |
# | GPIO07   | UART RX Pin (for PMS Sensor)     |
# | GPIO08   | UART TX Pin (for PMS Sensor)     |
# | GPIO09   | UART RX Pin (for ZE08 Sensor)    |
# | GPIO10   | UART TX Pin (for ZE08 Sensor)    |
# | GPIO11   | I2C SDA Pin (Main bus)           |
# | GPIO12   | I2C SCL Pin (Main bus)           |
# | GPIO13   | Top Button Input                 |
# | GPIO14   | Free (JTAG)                      |
# | GPIO15   | Display Backlight PWM Output     |
# | GPIO16   | SPI MISO Pin                     |
# | GPIO17   | I2C SDA Pin (Secondary Bus)      |
# | GPIO18   | I2C SCL Pin (Secondary Bus)      |
# | GPIO19   | N.A.                             |
# | GPIO20   | N.A.                             |
# | GPIO21   | N.A.                             |
# | GPIO33   | N.A.                             |
# | GPIO34   | N.A.                             |
# | GPIO35   | SD card SPI3 CLK (display J4)    |
# | GPIO36   | SD card SPI3 MISO (display J4)   |
# | GPIO37   | SD card SPI3 MOSI (display J4)   |
# | GPIO38   | SD card SPI3 CS (display J4)     |
# | GPIO39   | SR602 PIR                        |
# | GPIO40   | Buzzer PWM Output                |
# | GPIO41   | N.A.                             |
# | GPIO42   | N.A.                             |
# | GPIO43   | N.A.                             |
# | GPIO44   | N.A.                             |
# | GPIO45   | N.A.                             |
# | GPIO46   | N.A.                             |
# | GPIO47   | N.A.                             |
# | ------------------------------------------- |

# I2C Bus 1:
# SDA Pin: GPIO11
# SCL Pin: GPIO12
# i2c device at address 0x44 SHT41
# i2c device at address 0x53 LTR390
# i2c device at address 0x58 SGP30
# i2c device at address 0x62 SCD40
# i2c device at address 0x77 BME680

# I2C Bus 2:
# SDA Pin: GPIO17
# SCL Pin: GPIO18
# i2c device at address 0x38 ATH21
# i2c device at address 0x53 ENS160