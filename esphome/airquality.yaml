# | :------- | :------------------------------- |
# | GPIO00   | Free (Boot Button).              |
# | GPIO01   | SPI CLK Pin                      |
# | GPIO02   | SPI MOSI Pin                     |
# | GPIO03   | Display CS Pin                   |
# | GPIO04   | Display DC Pin                   |
# | GPIO05   | Free (JTAG).                     |
