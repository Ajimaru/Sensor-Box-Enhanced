# Based on:
# Sensorbox v2 config for PCB SBR1
# config r2 (20241130)
# https://go.toms3d.org/sbr1

substitutions:
  name: airquality
  friendly_name: Airquality
  # QR204 thermal printer bridge (separate project): raw ESC/POS over TCP. The host is set in the web UI
  # ("Printer Host", text entity printer_host).
  printer_port: "9100"
  # Air filter (air_filter.h): set URL of the filter's fan speed number (web_server REST API, entity name
  # "Fan Speed"). The filter uses the same web UI login as this box (goes into a C++ string, so no " or \ in
  # it). The host is set in the web UI ("Filter Host", text entity filter_host).
  filter_fan_path: "/number/Fan%20Speed/set"
  filter_user: !secret web_server_username
  filter_password: !secret web_server_password

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  min_version: 2026.9.0
  name_add_mac_suffix: false
  # Shown in the device info and the web UI; keep the version in line with the release tag (v0.0.1 -> 0.0.1).
  project:
    name: "ajimaru.sensor-box-enhanced"
    version: "0.0.1"
  # SD card logging helper; must sit next to this YAML on the HA host.
  includes:
    - sd_logger.h
    # Screen printing on the QR204 thermal printer; must sit next to this YAML on the HA host.
    - thermal_print.h
    # Air filter control over the filter's REST API; must sit next to this YAML on the HA host.
    - air_filter.h
  on_boot:
    # SD card (display module J4) on its own SPI bus (SPI3): CLK GPIO35, MOSI GPIO37, MISO GPIO36, CS GPIO38.
    # begin() only starts the sdlog task, which sets up the bus and mounts the card; returns immediately.
    - priority: 700
      then:
        - lambda: sdlog::begin(35, 37, 36, 38);
    # Below 600: mipi_spi sets up at DATA (600) and allocates its buffer there; drawing earlier crashes.
    - priority: 590
      then:
        - lambda: |-
            id(display_main).fill(Color::BLACK);
            id(display_main).update();
        # "Backlight Presence" level for the first 30 s (see the script).
        - script.execute: adjust_backlight_based_on_light
    - priority: 550
      then:
        - delay: 30s
        - script.execute: adjust_backlight_based_on_light

esp32:
  board: esp32-s2-saola-1
  framework:
    type: arduino
    advanced:
      # SD card logging (sd_logger.h): ESPHome excludes these ESP-IDF components by default.
      include_builtin_idf_components: [fatfs, sdmmc, esp_driver_sdmmc, esp_driver_sdspi, wear_levelling]
      disable_vfs_support_dir: false

psram:

# Logging
logger:
  level: DEBUG

# Home Assistant API and failsafe mechanisms
api:
  # Keep running without an API client (HA outage); the box works standalone and every reboot restarts the ENS160.
  reboot_timeout: 0s
  encryption:
    key: !secret api_encryption_key
      
# Over-The-Air updates
ota:
  - platform: esphome

# provisioning Wi-Fi via serial
improv_serial:

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  #reboot_timeout: 15min
  ap:
    ssid: ${name}
    password: !secret wifi_password

captive_portal:

# Web server
web_server:
  port: 80
  version: 3
  auth:
    type: digest
    username: !secret web_server_username
    password: !secret web_server_password
  # Own section at the top for the SD card entities (otherwise split into "Configuration"/"Diagnostic").
  sorting_groups:
    - id: web_group_sd_card
      name: "SD Card"
      sorting_weight: -10
    - id: web_group_printer
      name: "Printer"
      sorting_weight: -9
    - id: web_group_backlight
      name: "Display Backlight"
      sorting_weight: -8
    - id: web_group_filter
      name: "Air Filter"
      sorting_weight: -7
    - id: web_group_calibration
      name: "Calibration"
      sorting_weight: -6

# Debug
debug:
  update_interval: 5s

text_sensor:
  # Last screen print (thermal_print.h); published by the 500 ms interval when it changes.
  - platform: template
    name: "Printer Status"
    id: printer_status
    icon: "mdi:printer-pos"
    entity_category: diagnostic
    web_server:
      sorting_group_id: web_group_printer
      sorting_weight: 2

  # Result of the last request to the air filter (air_filter.h); published by the 1 s interval when it changes.
  - platform: template
    name: "Filter Status"
    id: filter_status
    icon: "mdi:air-filter"
    entity_category: diagnostic
    web_server:
      sorting_group_id: web_group_filter
      sorting_weight: 3

  # Result of the last "Calibrate ..." press: the new offset per sensor (script calibrate_offsets).
  - platform: template
    name: "Calibration Status"
    id: calibration_status
    icon: "mdi:tune-variant"
    entity_category: diagnostic
    web_server:
      sorting_group_id: web_group_calibration
      sorting_weight: 5

  # Thresholds of fan speeds 1-6 that follow from the "Filter Speed 1/6 above ..." numbers (air_filter.h).
  - platform: template
    name: "Filter Steps"
    id: filter_steps
    icon: "mdi:stairs"
    entity_category: diagnostic
    web_server:
      sorting_group_id: web_group_filter
      sorting_weight: 5
    # Also updated when one of the numbers changes.
    update_interval: 60s
    lambda: |-
      return {"PM2.5: " +
              airfilter::steps_text(id(filter_pm_start).state, id(filter_pm_full).state, "µg/m³") +
              "; TVOC: " + airfilter::steps_text(id(filter_tvoc_start).state, id(filter_tvoc_full).state, "ppb")};

  - platform: template
    name: "SD Card Status"
    icon: "mdi:sd"
    entity_category: diagnostic
    web_server:
      sorting_group_id: web_group_sd_card
      sorting_weight: 1
    update_interval: 30s
    lambda: |-
      return {sdlog::get_status()};

  - platform: debug
    device:
      name: "Device Info"
    reset_reason:
      name: "Reset Reason"

  - platform: template
    name: "BME680 IAQ Classification"
    icon: "mdi:checkbox-marked-circle-outline"
    lambda: |-
      // Bosch BSEC IAQ index 0-500.
      if (!id(iaq_bme680).has_state() || isnan(id(iaq_bme680).state)) {
        return {"unknown"};
      }
      int iaq = (int) id(iaq_bme680).state;
      if (iaq <= 50) {
        return {"Excellent"};
      }
      else if (iaq <= 100) {
        return {"Good"};
      }
      else if (iaq <= 150) {
        return {"Lightly polluted"};
      }
      else if (iaq <= 200) {
        return {"Moderately polluted"};
      }
      else if (iaq <= 250) {
        return {"Heavily polluted"};
      }
      else if (iaq <= 350) {
        return {"Severely polluted"};
      }
      else if (iaq <= 500) {
        return {"Extremely polluted"};
      }
      else {
        return {"unknown"};
      }

  - platform: bme68x_bsec2
    bme68x_bsec2_id: bme680_bsec
    iaq_accuracy:
      name: "BME680 IAQ Accuracy"
      id: iaq_accuracy_bme680
      icon: "mdi:check-decagram-outline"

  - platform: template
    name: "ENS160 Status"
    icon: "mdi:timer-sand"
    lambda: |-
      if (id(ens160_chip).is_failed()) {
        return {"Not responding"};
      }
      // Set on failed reads or invalid output, cleared after the next successful read.
      if (id(ens160_chip).status_has_warning()) {
        return {"Read error"};
      }
      if (id(eco2_ens160).has_state()) {
        return {"Ready"};
      }
      float warmup = id(ens160_warmup_remaining).state;
      int remaining = isnan(warmup) ? 60 : (int) warmup;
      if (remaining > 0) {
        char buf[40];
        snprintf(buf, sizeof(buf), "Warming up (up to %d min)", remaining);
        return {std::string(buf)};
      }
      return {"No data"};

# QR Code generator
qr_code:
  - id: webserver_qr
    value: ""
    ecc: MEDIUM

# Global Variables
globals:
  - id: main_display_mode
    type: int
    restore_value: no
    initial_value: '0'
  - id: display_mode_toggle
    type: int
    initial_value: '0'
    restore_value: no 
  - id: last_bottom_toggle_time
    type: uint32_t
    initial_value: '0'
    restore_value: no
  - id: top_display_mode_toggle
    type: int
    initial_value: '0'
    restore_value: no 
  - id: last_top_toggle_time
    type: uint32_t
    initial_value: '0'
    restore_value: no
  - id: last_button_press_timestamp
    type: uint32_t
    initial_value: 'esp_timer_get_time() / 1000000ULL'
  - id: last_presence_release_timestamp
    type: uint32_t
    initial_value: '0'
  # Ambient-light state for the backlight (dark below 1 lx, bright again from 2 lx).
  - id: backlight_dark
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: buzzer_alarm_enabled
    type: bool
    restore_value: yes
    initial_value: 'false'
  # Set by the print_screen script; the next display update also draws the page for the printer.
  - id: print_requested
    type: bool
    restore_value: no
    initial_value: 'false'
  # Last thermalprint::state seen by the printer status interval; -1 = publish the current state again
  # (set after each print start, so a job that finishes within one 500 ms poll is not missed).
  - id: print_seen_state
    type: int
    restore_value: no
    initial_value: '-1'
  # Print result box on the screen for 3 s: 0 = none, 1 = "Copy sent", 2 = "Send failed".
  - id: print_toast
    type: int
    restore_value: no
    initial_value: '0'
  # Air filter control (script filter_control): fan speed 0-6 last picked from PM2.5 and from TVOC (-1 = off or no
  # reading), kept for the hysteresis; the speed last sent and when (millis), for sending on change or every 2 min.
  - id: filter_speed_pm
    type: int
    restore_value: no
    initial_value: '-1'
  - id: filter_speed_tvoc
    type: int
    restore_value: no
    initial_value: '-1'
  - id: filter_sent_speed
    type: int
    restore_value: no
    initial_value: '-1'
  - id: filter_last_send
    type: uint32_t
    restore_value: no
    initial_value: '0'
  # Last airfilter::state seen by the filter status interval; -1 = publish the current state again (set after
  # each send, so a request that finishes within one poll still updates the status).
  - id: filter_seen_state
    type: int
    restore_value: no
    initial_value: '-1'

# Printer bridge address (IP or host name, resolved per print by thermal_print.h); kept across reboots.
text:
  - platform: template
    name: "Printer Host"
    id: printer_host
    icon: "mdi:printer-pos"
    entity_category: config
    web_server:
      sorting_group_id: web_group_printer
      sorting_weight: 1
    mode: text
    optimistic: true
    restore_value: true
    # The bridge gets its address by DHCP and announces itself via mDNS.
    initial_value: "thermal-printer.local"
    min_length: 1
    max_length: 64

  # Air filter address (IP or host name, resolved per request by air_filter.h); kept across reboots.
  - platform: template
    name: "Filter Host"
    id: filter_host
    icon: "mdi:air-filter"
    entity_category: config
    web_server:
      sorting_group_id: web_group_filter
      sorting_weight: 4
    mode: text
    optimistic: true
    restore_value: true
    # No default: empty until set in the web UI; nothing is sent until then.
    min_length: 1
    max_length: 64

# Screen print size (thermal_print.h): 1x is shorter and prints in ~13 s, 1.5x is easier to read (~24 s).
select:
  - platform: template
    name: "Print Size"
    id: print_size
    icon: "mdi:resize"
    entity_category: config
    web_server:
      sorting_group_id: web_group_printer
      sorting_weight: 4
    options:
      - "1x (30 x 40 mm)"
      - "1.5x (45 x 60 mm)"
    initial_option: "1.5x (45 x 60 mm)"
    optimistic: true
    restore_value: true

# Buzzer Alarm, Temperatur and Humidity Offset per Sensor
number:
  # Screen print (thermal_print.h): which colors print black, and the paper feed after the image.
  - platform: template
    name: "Print Ink Threshold"
    id: print_ink_threshold
    icon: "mdi:contrast-box"
    entity_category: config
    web_server:
      sorting_group_id: web_group_printer
      sorting_weight: 6
    # A pixel prints black when its brightest color channel reaches this value (0-255); lower = bolder text.
    min_value: 16
    max_value: 240
    step: 8
    mode: BOX
    optimistic: true
    restore_value: true
    initial_value: 64
  - platform: template
    name: "Print Feed Lines"
    id: print_feed_lines
    icon: "mdi:arrow-expand-down"
    entity_category: config
    web_server:
      sorting_group_id: web_group_printer
      sorting_weight: 7
    # Lines fed after the image (plus one line feed), so its end clears the printer's tear bar.
    min_value: 0
    max_value: 20
    step: 1
    mode: BOX
    optimistic: true
    restore_value: true
    initial_value: 5
  # Display backlight levels, applied by the script adjust_backlight_based_on_light: "Presence" during boot,
  # while presence is detected and for 15 s after a button press or the end of presence; otherwise "Dark"
  # or "Bright" by the LTR390 (dark below 1 lx, bright again from 2 lx). 0 % switches the backlight off.
  - platform: template
    name: "Backlight Presence"
    id: backlight_presence_level
    icon: "mdi:account-eye"
    entity_category: config
    web_server:
      sorting_group_id: web_group_backlight
      sorting_weight: 2
    unit_of_measurement: "%"
    min_value: 0
    max_value: 100
    step: 5
    mode: SLIDER
    optimistic: true
    restore_value: true
    initial_value: 75
    on_value:
      - script.execute: adjust_backlight_based_on_light
  - platform: template
    name: "Backlight Bright (no presence)"
    id: backlight_bright_level
    icon: "mdi:weather-sunny"
    entity_category: config
    web_server:
      sorting_group_id: web_group_backlight
      sorting_weight: 3
    unit_of_measurement: "%"
    min_value: 0
    max_value: 100
    step: 5
    mode: SLIDER
    optimistic: true
    restore_value: true
    initial_value: 30
    on_value:
      - script.execute: adjust_backlight_based_on_light
  - platform: template
    name: "Backlight Dark (no presence)"
    id: backlight_dark_level
    icon: "mdi:weather-night"
    entity_category: config
    web_server:
      sorting_group_id: web_group_backlight
      sorting_weight: 4
    unit_of_measurement: "%"
    min_value: 0
    max_value: 100
    step: 5
    mode: SLIDER
    optimistic: true
    restore_value: true
    initial_value: 0
    on_value:
      - script.execute: adjust_backlight_based_on_light

  - platform: template
    name: "Manual Sea Level Pressure"
    id: manual_sea_level_pressure
    entity_category: config
    unit_of_measurement: "hPa"
    icon: "mdi:gauge"
    initial_value: 1014
    min_value: 950.0
    max_value: 1050.0
    step: 0.1
    mode: BOX
    optimistic: true    
    restore_value: true

  # Buzzer Alarm Treshholds
  - platform: template
    name: "CO2 Alarm Threshold"
    id: co2_alarm_threshold
    entity_category: config
    unit_of_measurement: "ppm"
    icon: "mdi:molecule-co2"
    initial_value: 1500
    min_value: 0
    max_value: 3000
    step: 1
    optimistic: true
    restore_value: true
    mode: BOX

  - platform: template
    name: "CH2O Alarm Threshold"
    id: ch2o_alarm_threshold
    entity_category: config
    icon: "mdi:gas-cylinder"
    unit_of_measurement: "ppb"
    initial_value: 200
    min_value: 0
    max_value: 1000
    step: 1
    optimistic: true
    restore_value: true
    mode: BOX

  - platform: template
    name: "TVOC Alarm Threshold (ENS160)"
    id: tvoc_alarm_threshold_ens
    entity_category: config
    icon: "mdi:radiator"
    unit_of_measurement: "ppb"
    initial_value: 1400
    min_value: 0
    max_value: 3000
    step: 1
    optimistic: true
    restore_value: true
    mode: BOX

  - platform: template
    name: "TVOC Alarm Threshold (SGP30)"
    id: tvoc_alarm_threshold_sgp30
    entity_category: config
    icon: "mdi:radiator"
    unit_of_measurement: "ppb"
    initial_value: 1000
    min_value: 0
    max_value: 3000
    step: 1
    optimistic: true
    restore_value: true
    mode: BOX

  - platform: template
    name: "PM1 Alarm Threshold"
    id: pm1_alarm_threshold
    entity_category: config
    unit_of_measurement: "µg/m³"
    initial_value: 15
    min_value: 0
    max_value: 50
    step: 1
    optimistic: true
    restore_value: true
    mode: BOX

  - platform: template
    name: "PM2.5 Alarm Threshold"
    id: pm25_alarm_threshold
    entity_category: config
    unit_of_measurement: "µg/m³"
    initial_value: 15
    min_value: 0
    max_value: 50
    step: 1
    optimistic: true
    restore_value: true
    mode: BOX

  - platform: template
    name: "PM10 Alarm Threshold"
    id: pm10_alarm_threshold
    entity_category: config
    unit_of_measurement: "µg/m³"
    initial_value: 30
    min_value: 0
    max_value: 100
    step: 1
    optimistic: true
    restore_value: true
    mode: BOX

  # Air filter control (script filter_control, air_filter.h): per value, fan speed 1 above the first number
  # and speed 6 above the second; speeds 2-5 lie in between ("Filter Steps" shows them). 0 turns the value off.
  # The higher speed of PM2.5 and TVOC wins.
  - platform: template
    name: "Filter Speed 1 above PM2.5 (0 = off)"
    id: filter_pm_start
    icon: "mdi:fan-speed-1"
    entity_category: config
    web_server:
      sorting_group_id: web_group_filter
      sorting_weight: 11
    unit_of_measurement: "µg/m³"
    initial_value: 5
    min_value: 0
    max_value: 200
    step: 1
    optimistic: true
    restore_value: true
    mode: BOX
    on_value:
      - component.update: filter_steps
  - platform: template
    name: "Filter Speed 6 above PM2.5"
    id: filter_pm_full
    icon: "mdi:fan-plus"
    entity_category: config
    web_server:
      sorting_group_id: web_group_filter
      sorting_weight: 12
    unit_of_measurement: "µg/m³"
    initial_value: 50
    min_value: 0
    max_value: 200
    step: 1
    optimistic: true
    restore_value: true
    mode: BOX
    on_value:
      - component.update: filter_steps
  # ENS160 TVOC; defaults from the box's Oct 2026 data (75 % of hours below ~530 ppb, 90 % below ~920 ppb).
  - platform: template
    name: "Filter Speed 1 above TVOC (0 = off)"
    id: filter_tvoc_start
    icon: "mdi:fan-speed-1"
    entity_category: config
    web_server:
      sorting_group_id: web_group_filter
      sorting_weight: 13
    unit_of_measurement: "ppb"
    initial_value: 500
    min_value: 0
    max_value: 10000
    step: 10
    optimistic: true
    restore_value: true
    mode: BOX
    on_value:
      - component.update: filter_steps
  - platform: template
    name: "Filter Speed 6 above TVOC"
    id: filter_tvoc_full
    icon: "mdi:fan-plus"
    entity_category: config
    web_server:
      sorting_group_id: web_group_filter
      sorting_weight: 14
    unit_of_measurement: "ppb"
    initial_value: 2000
    min_value: 0
    max_value: 10000
    step: 10
    optimistic: true
    restore_value: true
    mode: BOX
    on_value:
      - component.update: filter_steps

  # Calibration (script calibrate_offsets): readings of a reference thermometer/hygrometer next to the box; the
  # "Calibrate ..." buttons set the offsets below so that every sensor reads these values.
  - platform: template
    name: "Reference Temperature"
    id: ref_temperature
    icon: "mdi:thermometer-check"
    entity_category: config
    web_server:
      sorting_group_id: web_group_calibration
      sorting_weight: 1
    unit_of_measurement: "°C"
    initial_value: 21
    min_value: -10
    max_value: 50
    step: 0.1
    optimistic: true
    restore_value: true
    mode: BOX
  - platform: template
    name: "Reference Humidity"
    id: ref_humidity
    icon: "mdi:water-check"
    entity_category: config
    web_server:
      sorting_group_id: web_group_calibration
      sorting_weight: 2
    unit_of_measurement: "%"
    initial_value: 50
    min_value: 0
    max_value: 100
    step: 0.1
    optimistic: true
    restore_value: true
    mode: BOX

  # --- Temperatur-Offsets ---
  - platform: template
    name: "SHT41 Temperature Offset"
    id: temp_sht41_offset
    icon: "mdi:thermometer-plus"
    entity_category: config
    web_server:
      sorting_group_id: web_group_calibration
      sorting_weight: 10
    unit_of_measurement: "°C"
    mode: slider
    min_value: -30.0
    max_value: 30.0
    step: 0.1
    restore_value: true
    optimistic: true
    initial_value: 0.0    

  - platform: template
    name: "SCD40 Temperature Offset"
    id: temp_scd40_offset
    icon: "mdi:thermometer-plus"
    entity_category: config
    web_server:
      sorting_group_id: web_group_calibration
      sorting_weight: 11
    unit_of_measurement: "°C"
    mode: slider
    min_value: -30.0
    max_value: 30.0
    step: 0.1
    restore_value: true
    optimistic: true
    initial_value: 0.0

  - platform: template
    name: "AHT21 ENS160 Temperature Offset"
    id: temp_aht21_ens_offset
    icon: "mdi:thermometer-plus"
    entity_category: config
    web_server:
      sorting_group_id: web_group_calibration
      sorting_weight: 12
    unit_of_measurement: "°C"
    mode: slider
    min_value: -30.0
    max_value: 30.0
    step: 0.1
    restore_value: true
    optimistic: true
    initial_value: 0.0

  - platform: template
    name: "BME680 Temperature Offset"
    id: temp_bme680_offset
    icon: "mdi:thermometer-plus"
    entity_category: config
    web_server:
      sorting_group_id: web_group_calibration
      sorting_weight: 13
    unit_of_measurement: "°C"
    mode: slider
    min_value: -30.0
    max_value: 30.0
    step: 0.1
    restore_value: true
    optimistic: true
    initial_value: 0.0

  # --- Humidity-Offsets ---
  - platform: template
    name: "SHT41 Humidity Offset"
    id: hum_sht41_offset
    icon: "mdi:water-percent-alert"
    entity_category: config
    web_server:
      sorting_group_id: web_group_calibration
      sorting_weight: 14
    unit_of_measurement: "%"
    mode: slider
    min_value: -30.0
    max_value: 30.0
    step: 0.1
    restore_value: true
    optimistic: true
    initial_value: 0.0

  - platform: template
    name: "SCD40 Humidity Offset"
    id: hum_scd40_offset
    icon: "mdi:water-percent-alert"
    entity_category: config
    web_server:
      sorting_group_id: web_group_calibration
      sorting_weight: 15
    unit_of_measurement: "%"
    mode: slider
    min_value: -30.0
    max_value: 30.0
    step: 0.1
    restore_value: true
    optimistic: true
    initial_value: 0.0

  - platform: template
