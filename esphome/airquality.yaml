# Stuff
output:
  - platform: ledc
    pin: GPIO15
    id: backlight_pwm

  - platform: ledc
    pin: GPIO40
    id: buzzer_output

light:
  - platform: monochromatic
    output: backlight_pwm
    name: "Display Backlight"
    id: back_light
    icon: "mdi:lightbulb-multiple-outline"
    restore_mode: RESTORE_DEFAULT_OFF
    web_server:
      sorting_group_id: web_group_backlight
      sorting_weight: 1

binary_sensor:
  - platform: gpio
    pin:
      number: GPIO13
      mode:
        input: true
        pullup: true
      inverted: true
    id: top_btn
    filters:
      - delayed_on: 10ms
      # Was 300ms; the page now changes on release, so this delay adds directly to the page change.
      - delayed_off: 50ms
    on_press:
      then:
        - lambda: id(last_button_press_timestamp) = esp_timer_get_time() / 1000000ULL;
        - script.execute: adjust_backlight_based_on_light
        - delay: 15s
        - script.execute: adjust_backlight_based_on_light
    # Short press: next page. On release, so holding the button to print keeps the current page.
    on_click:
      min_length: 10ms
      max_length: 1s
      then:
        - lambda: |-
            int current_mode = id(main_display_mode);
            int next_mode;
            if (current_mode == 0) {
              next_mode = 3;
            } else if (current_mode == 3) {
              next_mode = 6;
            } else if (current_mode == 6) {
              next_mode = 1;
            } else if (current_mode == 1) {
              next_mode = 2;
            } else if (current_mode == 2) {
              next_mode = 4;
            } else if (current_mode == 4) {
              next_mode = 5;
            } else if (current_mode == 5) {
              next_mode = 7;
            } else if (current_mode == 7) {
              next_mode = 0;
            } else {
              next_mode = 0;
            }
            id(main_display_mode) = next_mode;
            // Redraw via the display's own scheduler slot so the ~250 ms draw counts against the
            // display's blocking threshold instead of logging "a scheduled task" on every press.
            App.scheduler.set_timeout(id(display_main), "page_change", 0, []() { id(display_main).update(); });
    # Hold 5 s: print the current page. Fires while the button is still held.
    on_multi_click:
      - timing:
          - ON for at least 5s
        # Default 1s would ignore a hold that starts right after a short press.
        invalid_cooldown: 0s
        then:
          - script.execute: print_screen

  - platform: template
    name: "High CO2 Alert"
    id: high_co2_alert
    icon: "mdi:shield-alert"
    lambda: |-
      return id(co2_scd40).state > id(co2_alarm_threshold).state;

  - platform: gpio
    pin: GPIO39
    id: presencesensor
    icon: "mdi:motion-sensor"
    name: "Presence Sensor"
    device_class: motion
    filters:
      - delayed_off: 100ms

    on_press:
      then:
        - script.execute: adjust_backlight_based_on_light

    on_release:
      then:
        - lambda: id(last_presence_release_timestamp) = esp_timer_get_time() / 1000000ULL;
        - delay: 15s
        - script.execute: adjust_backlight_based_on_light

