# Dependabot: once a month, one grouped pull request, minor and major updates only (no patch releases).
# ESPHome isn't a Dependabot ecosystem, so this covers GitHub Actions workflows (none yet).
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      github-actions:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "major"
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-patch"
